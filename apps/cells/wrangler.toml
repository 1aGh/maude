# Maude Cloud DATA PLANE — one Worker, every tenant cell.
#
# SEPARATE FROM THE CONTROL PLANE, and not for tidiness.
#
#   1. `wrangler deploy` RECONCILES a script's routes: any custom domain not
#      declared in its config is DELETED. Tenant hostnames are created per
#      project at provision time, so they can never be in a committed config —
#      a control-plane deploy would silently unroute every customer. Observed,
#      not theorised: it removed alligators.cloud.maude.sh mid-Phase-15.
#   2. The two are different trust surfaces (DDR-193). The control plane holds
#      billing, identity and the platform master secret; a cell holds one
#      tenant's work. Deploying one should not be able to take down the other.
#
# This config declares NO routes on purpose. Tenant hostnames are Worker custom
# domains created through the API — the only mechanism that gives a third-level
# name both a route and a certificate on the free plan (a wildcard route must
# have its wildcard at the start of the hostname, and Universal SSL covers one
# level).

name = "maude-cells"
main = "worker.mjs"
compatibility_date = "2026-07-01"
preview_urls = false
# workers.dev is ON, and it is not a convenience.
#
# A Worker with no routes and no triggers UPLOADS a version but never DEPLOYS
# one — `wrangler deploy` prints "No targets deployed" — and a container image
# rollout attaches to a deployment. The symptom is brutal to diagnose: every
# deploy reports `image = v1 -> v2  SUCCESS`, and the application keeps running
# v1 forever. This gives the script one deployable target so rollouts land.
#
# It is not a second way in: the worker resolves a tenant from the HOSTNAME,
# and a `.workers.dev` hostname is not one, so it answers 404 there.
workers_dev = true

[[containers]]
class_name = "MaudeCellB"
# v12 (Cloud Phase 25): the first image carrying the canvas build sandbox.
#
# THIS LINE IS THE ROLLOUT INSTRUCTION — `cells-deploy.yml` reads the tag from
# here, builds THAT tag and deploys it. Leaving it unchanged is not a no-op
# with a new image behind it: pushing new content to an existing tag leaves the
# container configuration byte-identical, so the deploy prints
# `no changes maude-cells-maudecell` and every instance keeps running the old
# digest. It looks like a successful deploy. It is not one. Bump the tag.
image = "registry.cloudflare.com/b5b596efe65abb732777c7171dc18145/maude-cell:v1.4.1"
# THE FLEET CEILING — Cloud Phase 24 B2.
#
# It was 1: "the tenant-of-one pilot". That is not a scaling nicety, it is a
# hard block on customer number two — a second concurrent tenant cannot get a
# container, their waiting room times out, and DDR-203's provision-first
# ordering VOIDS the sale. Correct behaviour, no revenue.
#
# WHAT ONE INSTANCE COSTS. Phase 0 §2's economics were never measured, so this
# is the STATED GUESS the audit asked for rather than a measurement — list
# price at the time of writing, arithmetic shown so the first real invoice can
# correct it. `standard-1` is 1/2 vCPU, 4 GiB memory, 8 GB disk, billed while
# RUNNING (a cell sleeps after 20m idle, see `sleepAfter`):
#
#   cpu     0.5 vCPU × $0.000020 /vCPU-s  = $0.0000100 /s
#   memory  4 GiB    × $0.0000025 /GiB-s  = $0.0000100 /s
#   disk    8 GB     × $0.00000007 /GB-s  = $0.0000006 /s
#                                          ≈ $0.074 /hour  ≈ $53 /month at 24×7
#
# A club volunteer designing ~2 h a day wakes a cell for roughly 75 h a month:
# ~$5.50 against a €29 plan. A cell pinned awake all month is ~$53, which a
# €29 plan does NOT cover — that is the number to watch, and the reason
# `sleepAfter` is load-bearing rather than tidy.
#
# WHY 5 AND NOT 25. This is a ceiling, but the platform has been observed
# trying to keep this many SCHEDULED, which is not the same as this many in
# use: three once sat in `scheduling` forever and blocked every image rollout
# at version 1 while the single DO-managed instance kept serving the old image.
# If that behaviour persists, 5 idle instances is ~$265/month for nothing. So:
# raise enough to unblock customer #2 through #5, then VERIFY before raising
# again — check the Containers dashboard for instances stuck in `scheduling`
# after the next rollout, and check the first month's invoice against the
# arithmetic above.
# LEFT AT 5 — raising it was tried during the 2026-08-03 incident and REVERTED.
# It did not restore the cell, and it cost immediately: at 12 the platform
# scaled to 7 instances within seconds, which by the arithmetic above is
# ~$370/month for containers nobody asked for. The ceiling is a cost control
# first; treat raising it as a billing decision, not a debugging step.
max_instances = 5
# `basic` is 1/4 vCPU and 4 GB disk. A first-boot seed clone of a real design
# project (alligators: ~280 MB working tree) could not finish checking out
# before the platform gave up waiting for the port, so the container was killed
# mid-clone and came up with an empty repo. standard-1 doubles the CPU and the
# disk; the seed is the slowest thing a cell ever does and it happens once.
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "MAUDE_CELL"
class_name = "MaudeCellB"

# Accepted revisions (DDR-241): each project's durable store, keyed by tenant.
# Its OWN class so a container-class migration (see v2 below) never touches it.
[[durable_objects.bindings]]
name = "PROJECT_STORE"
class_name = "ProjectStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MaudeCell"]

# v2 — a fresh namespace for every cell (2026-08-03). See worker.mjs's note on
# MaudeCellB: a Durable Object that has lost its container will not release the
# handle for a redeploy, an image rollback, or a container-application rebuild.
# The old objects are abandoned deliberately; they held only a tenant id and a
# cached config, both re-derived on the next request.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["MaudeCellB"]

# v3 — the accepted-revisions store (DDR-241). NEVER abandon this namespace
# the way v2 abandoned MaudeCell: it holds the project's accepted history.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["ProjectStore"]

# The SNAPSHOTS binding is gone with the gallery it served (Cloud Phase 25 C5).
# Nothing in this Worker reads object storage any more: a cell's own storage
# credentials are minted per tenant by the control plane (A-1) and used INSIDE
# the container, which is the only place they belong.

[vars]
# The zone whose subdomains are projects: `<tenant>.cloud.maude.sh`.
CELL_ZONE = "cloud.maude.sh"
MAUDE_R2_BUCKET = "maude-cloud-assets"
# Outbound-ingress tunnel (Phase 25, 2026-08-03): which tenant rides it and on
# which hostname. The token itself is a secret (MAUDE_TUNNEL_TOKEN). One
# tenant for now — the control plane learns to mint these per tenant next.
MAUDE_TUNNEL_TENANT = "alligators"
MAUDE_TUNNEL_HOST = "t-alligators.cloud.maude.sh"
# DESKTOP ↔ CLOUD LIVE PAIRING — the pilot allowlist. Comma-separated tenant
# ids, or `*` for the whole fleet. Empty/absent = off, which is how every cell
# behaved before this shipped.
#
# This changes the CRDT layer, so it rolls one project at a time. Widening to
# `*` is a deliberate edit, made only once the pilot has been watched.
#
# NB: env applies at CONTAINER START. Changing this value does not reach a
# running instance — the cell has to stop and be woken again (idle timeout, or
# an explicit /_cell/restart). A byte-identical config is a no-op roll.
CELL_LIVE_PAIRING = "alligators"
# ACCEPTED REVISIONS (DDR-241) — which tenants' cells get their durable
# ProjectStore (the Durable Object bound above). Same shape as live pairing: a
# tenant allowlist, `do` or `*` for the fleet. A listed cell can switch its
# project to accepted revisions; the switch itself is still the project
# owner's step (docs/operations/project-multiplayer-rollout.md). Env applies
# at container start.
CELL_PROJECT_STORE = "alligators"
# feature-cloud-export-render-workers (DDR-230) — where a cell dispatches
# browser-format export jobs. Reaches the studio child via cellEnv →
# childEnv. Remove (or leave unset) to put the fleet's export lane back to
# `none` — exports then refuse with a remedy, they don't 404. Remember: env
# applies at container START — a change here reaches a cell on its next wake.
MAUDE_RENDER_URL = "https://render.cloud.maude.sh"

# Secrets (wrangler secret put):
#   CELL_SECRET_MASTER          per-cell HUB_SECRETs are derived from this
#   MAUDE_RENDER_SECRET         ingress bearer for the maude-render service
#                               (DDR-230). Shared with apps/render's Worker;
#                               NEVER derived from CELL_SECRET_MASTER.
#
# Cloud Phase 25 A-1: the bucket-wide R2 key no longer belongs here. Cells
# mint per-tenant TEMPORARY credentials from the control plane at container
# start (cell-do.mjs → /internal/cell-r2-credentials), scoped to
# `tenants/<id>/` and TTL-bounded. The legacy secrets below are a migration
# fallback only — DELETE them once the control plane mints successfully:
#   MAUDE_R2_ENDPOINT / MAUDE_R2_ACCESS_KEY_ID / MAUDE_R2_SECRET_ACCESS_KEY

# LOGS. Absent this block a Worker keeps NOTHING: `wrangler tail` shows only
# what is happening while you happen to be watching, and every historical
# query comes back empty. That is how the 2026-08-03 outage was diagnosed —
# by guessing, repeatedly and wrongly, because the reason a cell refused to
# start was written to a stream nobody was recording.
#
# A3's on-call runbook assumes an operator can answer "what happened"; this is
# the cheapest thing that makes that true.
[observability]
enabled = true
head_sampling_rate = 1
