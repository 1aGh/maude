# Maude Cloud control plane — Cloud Phase 12.
#
# Deployable the moment Phase 11 clears (Workers Paid + zone). Until then:
# `wrangler deploy --dry-run` must stay clean, and D1 (Free-tier reachable)
# carries the schema so /health can be proven the day the route exists.
#
# Queues are COMMENTED, not configured-and-broken: they need Workers Paid, and
# the jobs TABLE is the durable record either way — a queue is only a faster
# drain of it (worker.mjs header). Uncomment in Phase 11's wake.

name = "maude-cloud"
main = "worker.mjs"
compatibility_date = "2026-07-01"
preview_urls = false

# The control plane answers on cloud.maude.sh. Tenant hostnames
# (`<tenant>.cloud.maude.sh`) are NOT listed here: each is a Worker CUSTOM
# DOMAIN created when the project is provisioned, which is the only mechanism
# that gives a third-level name both a route and a certificate. A wildcard
# route cannot express it (Cloudflare allows a wildcard only at the start of a
# hostname) and free Universal SSL does not cover it. Both were tried first.
routes = [
  { pattern = "cloud.maude.sh", custom_domain = true },
]

[triggers]
crons = ["0 * * * *"]   # hourly reconcile sweep — the source of truth pass

[vars]
# Provisioning a project = attaching `<id>.cloud.maude.sh` to the data-plane
# Worker (apps/cells) through the API. The ids are not secrets; the token
# (CF_PROVISION_TOKEN, `wrangler secret put`) is.
CF_ACCOUNT_ID = "b5b596efe65abb732777c7171dc18145"
CF_ZONE_ID = "b27eb712a0031253edf58c0e31c57b7b"
CELL_ZONE = "cloud.maude.sh"
# The one bucket every tenant's objects live in, under their own
# `tenants/<id>/` prefix (Cloud Phase 25 A-1). Declared rather than defaulted:
# a hidden default for "which bucket" is a hidden default for whose data, and
# it made `mintingConfigured()` and `mintTenantCredentials()` disagree about
# whether the platform was ready — /health said not-configured while the code
# that does the work would have been happy.
MAUDE_R2_BUCKET = "maude-cloud-assets"
# Who may open `/operator` — Cloud Phase 26. A comma-separated list of ACCOUNT
# IDS (`acct_…`), not emails: an email claim varies with the identity provider
# (`.` insertion, `+` aliases, case) and none of that variance belongs in an
# authorisation decision. Not a column on `accounts`, either — that table's
# whole design is "a total loss of this database costs a customer nothing", and
# an env var is revocable in seconds without touching it.
#
# EMPTY IS THE DEFAULT, AND IT DISABLES THE SURFACE COMPLETELY: with no value,
# every `/operator` request 404s, including for the owner's own account.
# Turning it on is a deploy-time act, deliberately — this is the one surface
# that reads across tenants, and it should not be reachable because somebody
# once signed in.
#
# Not a secret. The ids are not credentials, and `wrangler secret` would hide
# the one fact worth reviewing in a diff: who can see the whole fleet.
# acct_ms73cs9w_kc8grl — m.dovrtel@gmail.com (owner)
OPERATOR_ACCOUNT_IDS = "acct_ms73cs9w_kc8grl"

[[d1_databases]]
binding = "DB"
database_name = "maude-cloud-control-plane"
database_id = "cf2b8fdc-6c3f-42f9-9305-0040e01391eb"  # live; schema v1 applied 2026-07-28, idempotence re-proven 2026-07-29

# The dashboard's "Download everything" serves export files the CELL wrote
# (Cloud Phase 20). Same bucket the cells use; the binding reads only
# `tenants/<id>/exports/` keys, enforced in project-admin.mjs.
[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "maude-cloud-assets"

# Product analytics — Cloud Phase 26. Deliberately NOT a D1 table: schema.sql
# promises "a total loss of this database costs a customer nothing", and a
# per-request events table would put a behavioural record of every customer
# inside that blast radius AND put an INSERT on the login path, contending with
# edge.mjs `spend()` on the most expensive request the plane answers.
#
# Analytics Engine is Cloudflare, already a named subprocessor, so this needed
# no DPA change — only an honest privacy notice, which shipped in the same
# change (apps/cloud/privacy-claims.test.mjs keeps the two from drifting).
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "maude_cloud_events"

# [[queues.producers]]
# binding = "RECONCILE_QUEUE"
# queue = "maude-reconcile"
# [[queues.consumers]]
# queue = "maude-reconcile"

# Secrets (wrangler secret put): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#
# Cloud Phase 25 A-1 — per-tenant R2 credentials. The control plane is now the
# ONLY holder of a bucket-reaching credential; cells mint temporary, prefix-
# scoped credentials through /internal/cell-r2-credentials. Required for that:
#   R2_CREDS_TOKEN            Cloudflare API token with Account → R2 write
#                             (falls back to CF_PROVISION_TOKEN if that token
#                             carries the permission)
#   R2_PARENT_ACCESS_KEY_ID   the parent R2 access key id the temp creds are
#                             signed against (its secret never leaves CF)
#   CF_ACCOUNT_ID             already required by provisioning
#   MAUDE_R2_BUCKET           var, declared in [vars] above (NOT defaulted)
#
# Cloud Phase 26 — READING the events back (the operator board's usage page).
# Writing needs only the binding above; reading goes over the REST SQL API and
# therefore needs a token:
#   CF_ANALYTICS_TOKEN        Cloudflare API token, scope = Account Analytics
#                             Read AND NOTHING ELSE. Optional on purpose: unset
#                             renders "analytics is not connected" rather than
#                             an error, because a board that 500s when one tile
#                             has no data cannot report the outage it exists for.

# The MaudeCell class briefly lived here before the split. Deleting it is safe
# and deliberate: no cell ever completed a start under this script, so the
# namespace holds no tenant state. The data plane creates its own.
#
# v1 is the creation that was deployed before it was ever committed. It is
# written down so the list is self-consistent: wrangler ≥ 4.13x validates the
# migrations statically and refused "deleted_classes … non-existent class
# MaudeCell", failing every control-plane deploy since 2026-09-04. The live
# script is already at v2, so neither step runs again.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MaudeCell"]

[[migrations]]
tag = "v2"
deleted_classes = ["MaudeCell"]

# Cells live in a SEPARATE Worker (apps/cells). `wrangler deploy` reconciles a
# script's routes and deletes any custom domain not declared in its config —
# and tenant hostnames are created per project at provision time, so they can
# never be in a committed config. Keeping them here would mean every
# control-plane deploy silently unrouted every customer.

# LOGS. Absent this block a Worker keeps NOTHING: `wrangler tail` shows only
# what is happening while you happen to be watching, and every historical
# query comes back empty. That is how the 2026-08-03 outage was diagnosed —
# by guessing, repeatedly and wrongly, because the reason the control plane refused to
# start was written to a stream nobody was recording.
#
# A3's on-call runbook assumes an operator can answer "what happened"; this is
# the cheapest thing that makes that true.
[observability]
enabled = true
head_sampling_rate = 1
