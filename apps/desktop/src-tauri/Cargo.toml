[package]
name = "maude-desktop"
version = "1.4.4"
description = "Maude native desktop shell — Tauri v2 sidecar over the compiled dev-server binary (DDR-106)"
authors = ["Maude"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maude_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# maude:// protocol handler (Cloud Phase 17): scheme registration lives in
# tauri.conf.json plugins.deep-link (bundled builds only — dev never registers).
tauri-plugin-deep-link = "2"
# Auto-update (Phase 32 / Task 1): poll a signed JSON feed, download in the
# background, apply on restart. Endpoints + ed25519 pubkey are in tauri.conf.json;
# the matching private key signs the artifacts in CI (TAURI_SIGNING_PRIVATE_KEY).
# Driven entirely from Rust (src/updater.rs) so the remote dev-server origin never
# gets `updater:default` — only the narrow `restart_to_update` command.
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "signal", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitHub OAuth device flow (DDR-108): HTTPS to github.com from the Rust core, not
# the webview — rustls so CI/cross-platform builds need no system OpenSSL.
# "stream" (RCA issue-desktop-print-pdf-save-as-hang-large-payload): save_export
# streams a finished export job's bytes straight from the local dev-server to
# disk instead of ferrying them through the WebView↔Rust IPC bridge as a JSON
# argument, which chokes on a payload the size a print-ready PDF can reach.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Drives reqwest's `.bytes_stream()` in save_export's chunked download-to-disk.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# OS keychain for the GitHub token (DDR-108): macOS Keychain / Windows Credential
# Manager / Linux Secret Service — the token never touches disk.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Loopback-only token bridge so the sidecar can read the keychain token at request
# time (the webview/dev-server can't reach the OS keychain directly).
tiny_http = "0.12"
# Open the system browser at the device-flow verification URL (no plugin/capability).
open = "5"
# Random shared-secret key for the loopback token bridge (already in the tree via rustls).
getrandom = "0.2"
# Desktop E2E (DOM-driven, @wdio/tauri-service): embedded W3C WebDriver server for
# driving the real WKWebView in scenario tests. Registered ONLY under
# `#[cfg(debug_assertions)]` in lib.rs, so the shipped release `.app` never runs it
# (the crate is a compile-time dep so its `wdio-webdriver:default` permission still
# resolves for capability validation in both profiles, but `init()` is never called
# in release). See .ai/plans/feature-desktop-e2e-scenario-harness.md + the
# `desktop-e2e` skill.
tauri-plugin-wdio-webdriver = "1.2.0"
# feature-acp-turn-notifications — a REAL OS notification, regardless of which
# project's page is loaded or whether any page is loaded at all. The Web
# `Notification` API inside the webview (app.jsx) can only ever cover the
# project currently on screen; this is what closes the cross-project +
# detached-chat gap (see notify.rs).
tauri-plugin-notification = "2"
