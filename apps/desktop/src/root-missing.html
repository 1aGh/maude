<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maude</title>
    <!--
      The moved-folder card (S1.19, 11 Projects and Navigation · pn-cant-open). A trusted app-local
      page a project tab shows when its folder is gone — moved or renamed on disk. Rust sends the tab
      here (tabs.rs `show_missing`); the splash forwards here too when `resolve_dev_server_url` answers
      `{missing}`. It takes no input from anywhere but that answer — the tab's OWN pid, the name the
      registry knew and where the folder was — and asks Rust for one thing: `relink_project({pid})`,
      which Rust allows from this page only for this tab's own project while its folder is still gone
      (home.rs `relink_allowed`). On a relink Rust moves the tab to the new folder itself.
      Tokens: the maude-v2 names and values (.design/system/maude-v2/colors_and_type.css), copied —
      an app-local page loads nothing from a project server.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg-0: oklch(0.978 0.005 240);
        --bg-2: oklch(1 0 0);
        --bg-3: oklch(0.958 0.006 240);
        --fg-0: oklch(0.24 0.014 250);
        --fg-1: oklch(0.42 0.012 250);
        --fg-2: oklch(0.505 0.01 250);
        --fg-3: oklch(0.7 0.008 250);
        --accent: oklch(0.53 0.175 238);
        --accent-hover: oklch(0.49 0.17 238);
        --accent-active: oklch(0.46 0.165 238);
        --accent-fg: oklch(1 0 0);
        --focus-ring: var(--accent);
        --status-error: oklch(0.55 0.19 22);
        --radius-md: 10px;
        --radius-lg: 14px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-5: 24px;
        --type-xs: 11px;
        --type-sm: 12px;
        --type-md: 17px;
        --lh-xs: 1.36;
        --lh-sm: 1.42;
        --lh-md: 1.4;
        --w-semibold: 600;
        --font-body: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Inter", sans-serif;
        --dur-flip: 120ms;
        --ease-out: cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-0: oklch(0.205 0.006 250);
          --bg-2: oklch(0.275 0.008 250);
          --bg-3: oklch(0.3 0.008 250);
          --fg-0: oklch(0.965 0.004 250);
          --fg-1: oklch(0.8 0.006 250);
          --fg-2: oklch(0.72 0.008 250);
          --fg-3: oklch(0.5 0.008 250);
          --accent: oklch(0.54 0.165 238);
          --accent-hover: oklch(0.5 0.16 238);
          --accent-active: oklch(0.47 0.155 238);
          --focus-ring: oklch(0.72 0.14 238);
          --status-error: oklch(0.69 0.17 22);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        :root {
          --dur-flip: 1ms;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg-0);
        color: var(--fg-0);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      main {
        height: 100%;
        display: grid;
        place-items: center;
      }
      .gone {
        width: 400px;
        max-width: calc(100% - 2 * var(--space-5));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
        text-align: center;
      }
      /* Hidden until the answer names the project: no card about nobody. */
      .gone[hidden] {
        display: none;
      }
      .gone-ic {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: var(--radius-lg);
        background: var(--bg-3);
        color: var(--fg-1);
      }
      .gone-t {
        margin: 0;
        font-size: var(--type-md);
        line-height: var(--lh-md);
        font-weight: var(--w-semibold);
      }
      .gone-b {
        margin: 0;
        max-width: 44ch;
        font-size: var(--type-sm);
        line-height: var(--lh-sm);
        color: var(--fg-1);
      }
      .gone-f {
        margin: 0;
        font-size: var(--type-xs);
        line-height: var(--lh-xs);
        color: var(--fg-2);
      }
      .gone-err {
        margin: 0;
        font-size: var(--type-xs);
        line-height: var(--lh-xs);
        color: var(--status-error);
      }
      .btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0 var(--space-3);
        border: 0;
        border-radius: var(--radius-md);
        font: inherit;
        font-size: var(--type-sm);
        font-weight: var(--w-semibold);
        line-height: 1;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-fg);
        transition:
          background var(--dur-flip) var(--ease-out),
          transform var(--dur-flip) var(--ease-out);
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn:active {
        background: var(--accent-active);
        transform: scale(0.97);
      }
      .btn:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
      .btn[disabled] {
        background: var(--bg-3);
        color: var(--fg-3);
        cursor: not-allowed;
        transform: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="gone" data-testid="root-missing-card" aria-labelledby="gone-t" hidden>
        <span class="gone-ic" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" />
          </svg>
        </span>
        <p class="gone-t" id="gone-t" data-testid="root-missing-title"></p>
        <p class="gone-b" data-testid="root-missing-place"></p>
        <button type="button" class="btn" data-testid="root-missing-find">Find the folder…</button>
        <p class="gone-err" data-testid="root-missing-error" role="alert" hidden></p>
        <p class="gone-f">Closing the tab keeps it on Home.</p>
      </section>
    </main>
    <script>
      (function () {
        var tauri = window.__TAURI__;
        var invoke = tauri && tauri.core && tauri.core.invoke;
        // Opened outside the Tauri shell: nothing to say about any project.
        if (!invoke) return;
        var card = document.querySelector('.gone');
        var title = document.querySelector('.gone-t');
        var body = document.querySelector('.gone-b');
        var find = document.querySelector('.btn');
        var err = document.querySelector('.gone-err');
        var pid = null;

        // textContent only: the name and the place come from the registry and the old path.
        function render(answer) {
          pid = String(answer.pid || '');
          var name = String(answer.name || 'This project');
          title.textContent = name + " isn't where it was.";
          var place = String(answer.place || '');
          body.textContent =
            (place ? 'It was in ' + place + '. ' : '') +
            'Nothing inside has changed — the folder was moved or renamed.';
          card.hidden = false;
        }

        function showError(text) {
          err.textContent = text;
          err.hidden = !text;
        }

        // Ask which project this tab is; anything but "its folder is gone" goes back through the
        // splash, which knows every other state (starting, resting, recovering).
        invoke('resolve_dev_server_url').then(
          function (answer) {
            if (answer && typeof answer === 'object' && answer.missing) render(answer);
            else window.location.replace('index.html');
          },
          function () {
            window.location.replace('index.html');
          }
        );

        find.addEventListener('click', function () {
          if (!pid || find.disabled) return;
          find.disabled = true;
          showError('');
          invoke('relink_project', { pid: pid }).then(
            function (moved) {
              // null = the picker was cancelled. Otherwise Rust moves this tab to the folder.
              if (moved == null) find.disabled = false;
            },
            function (e) {
              find.disabled = false;
              showError(String(e || 'That folder could not be used.'));
            }
          );
        });
      })();
    </script>
  </body>
</html>
