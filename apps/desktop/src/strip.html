        overflow: hidden;

        color: var(--strip-fg);
        font: 400 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .strip {
        display: flex;
        align-items: stretch;
        /* The titlebar row (tabs.rs STRIP_H) — the page itself grows while the tab list is open. */
        height: 38px;
        box-sizing: border-box;
        border-bottom: 1px solid var(--tab-sep);
      }
      /* The traffic lights sit over the left 78 px (TitleBarStyle::Overlay). */

        flex: 0 0 78px;
      }
      /* V2-8.7: the tablist wrapper around Home + the tabs is semantics only — its children stay the strip's flex items. */
      .tabrow {
        display: contents;
      }
      .tabs {
        flex: 1 1 auto;
        display: flex;
        align-items: stretch;
        gap: 2px;
        min-width: 0;
        padding: 4px 8px 4px 4px;
      }
      .tab {
        position: relative;
        flex: 0 1 200px;
        /* S1.22b: the square, a short name and the × always fit (strip.js MIN_TAB). */
        min-width: 120px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2, 8px);
        /* P8-C8 (11 pn-tab-b20): a tab at rest keeps the board's k-tab--dense padding (space-2) so

        color: var(--strip-fg);

        font-weight: 600;
        box-shadow: var(--shadow-sm), inset 0 0 0 0.5px var(--border-subtle);

        outline: none;
        user-select: text;
        -webkit-user-select: text;
      }

        padding: 6px;
        outline: none;
      }

        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-radius: 8px;
      }

        background: var(--panel-row-hover);
      }
      .row.selected {
        background: var(--panel-row-on);
      }

        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

        font: 600 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

        white-space: nowrap;
        text-overflow: ellipsis;
      }

        font-size: 11px;
        color: var(--strip-fg-dim);
      }

      .row.selected .words span {

        content: " · this tab";
        font-weight: 400;
        color: var(--strip-fg-dim);
      }

        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        background: var(--tab-hover);
        white-space: nowrap;

  <body>
    <!-- V2-8.7: the page's one main landmark + h1 (p8-fixups2); the h1 is read, never drawn. -->
    <main>
    <h1 class="sr-only">Maude tabs</h1>
    <nav class="strip" data-tauri-drag-region data-testid="tab-strip" aria-label="Tabs">
      <div class="lights" data-tauri-drag-region></div>
      <!-- V2-8.7: Home and the project tabs are ONE tablist (a tab needs a tablist parent); the wrapper draws no box. -->
      <div class="tabrow" role="tablist" aria-label="Open projects">
      <!-- S1.22c (CONTRACT §1/§6, amended 2026-10-14): Home is the pinned, icon-only FIRST tab. -->
      <button
        type="button"
        class="home"
        id="home"
        role="tab"
        data-testid="tab-home"
        aria-label="Home"
        title="Home"
        aria-selected="false"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path
            d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H9.5V10h-3v3.5H3a.5.5 0 0 1-.5-.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div class="tabs" id="tabs" data-tauri-drag-region></div>
      </div>
      <button
        type="button"
        class="more"
        id="more"
        data-testid="tab-more"
        aria-haspopup="listbox"
        aria-expanded="false"
        title="The other open tabs"
        hidden
      ></button>
    </nav>
    <div class="overview" id="overview" data-testid="tab-overview" hidden>
      <div class="panel" role="dialog" aria-labelledby="overview-title">
        <div class="panel-head">
          <h2 id="overview-title">All tabs</h2>
          <input
            class="find"
            id="find"
            type="search"
            data-testid="tab-overview-find"
            placeholder="Find a tab"
            aria-label="Find a tab"
            aria-controls="list"
            spellcheck="false"
            autocomplete="off"
          />
        </div>
        <!-- tabindex 0: the list scrolls, so the keyboard must be able to reach it (axe scrollable-region-focusable) -->
        <div class="list" id="list" role="listbox" aria-label="Open tabs" tabindex="0"></div>
      </div>
    </div>
    </main>
    <script src="strip.js"></script>
  </body>
</html>
