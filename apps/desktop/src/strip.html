<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs</title>
    <!--
      Maude's own tab bar (V2-3.7, contract V2-3.7-own-tab-bar.md). A trusted
      app-local page in the `strip` child webview of the one `shell` window: it
      draws what Rust sends it (tabs_state + its Channel) and asks Rust to act
      (tab_activate / tab_close). It knows no project beyond a sanitized name.
      Deliberately plain and native-feeling — the Phase 4 shell design restyles it.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --strip-bg: #e9e9eb;
        --strip-fg: #3a3a3f;
        --strip-fg-dim: #77777e;
        --tab-hover: rgba(0, 0, 0, 0.05);
        --tab-active-bg: #f8f8f9;
        --tab-active-fg: #111114;
        --tab-sep: rgba(0, 0, 0, 0.12);
        --close-hover: rgba(0, 0, 0, 0.1);
        --focus: #4a7dff;
        --dot-done: #3fa35b;
        /* S5.14: needs you is azure (03 ai-needs-tab), the working spark is AI's vermilion. */
        --dot-needs: #2f6bff;
        --dot-working: #e8553a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --strip-bg: #1c1c1f;
          --strip-fg: #b7b7be;
          --strip-fg-dim: #7d7d85;
          --tab-hover: rgba(255, 255, 255, 0.05);
          --tab-active-bg: #2b2b30;
          --tab-active-fg: #f1f1f4;
          --tab-sep: rgba(255, 255, 255, 0.1);
          --close-hover: rgba(255, 255, 255, 0.12);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--strip-bg);
        color: var(--strip-fg);
        font: 400 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      .strip {
        display: flex;
        align-items: stretch;
        height: 100%;
        box-sizing: border-box;
        border-bottom: 1px solid var(--tab-sep);
      }
      /* The traffic lights sit over the left 78 px (TitleBarStyle::Overlay). */
      .lights {
        flex: 0 0 78px;
      }
      .tabs {
        flex: 1 1 auto;
        display: flex;
        align-items: stretch;
        gap: 1px;
        min-width: 0;
        padding: 5px 4px 0;
      }
      .tab {
        position: relative;
        flex: 0 1 200px;
        min-width: 72px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px 0 10px;
        border-radius: 7px 7px 0 0;
        outline: none;
      }
      .tab:hover {
        background: var(--tab-hover);
      }
      .tab[aria-selected="true"] {
        background: var(--tab-active-bg);
        color: var(--tab-active-fg);
      }
      .tab:focus-visible,
      .home:focus-visible,
      .close:focus-visible {
        box-shadow: inset 0 0 0 2px var(--focus);
      }
      .tab.resting .name {
        color: var(--strip-fg-dim);
      }
      .name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .dot {
        flex: 0 0 7px;
        height: 7px;
        border-radius: 50%;
      }
      .dot.done {
        background: var(--dot-done);
      }
      /* S5.14: the azure "?" (needs you) and the spark (working) are glyph marks. */
      .dot.needs-you,
      .dot.working {
        flex-basis: 14px;
        width: 14px;
        height: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: 600 10px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .dot.needs-you {
        background: var(--dot-needs);
        color: #fff;
      }
      .dot.working {
        color: var(--dot-working);
        font-size: 12px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .dot.working {
          animation: strip-spark 1.6s ease-in-out infinite;
        }
      }
      @keyframes strip-spark {
        50% {
          opacity: 0.45;
        }
      }
      .close,
      .home {
        border: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        outline: none;
      }
      .close {
        flex: 0 0 18px;
        height: 18px;
        border-radius: 4px;
        opacity: 0;
      }
      .tab:hover .close,
      .tab[aria-selected="true"] .close,
      .close:focus-visible {
        opacity: 1;
      }
      .close:hover {
        background: var(--close-hover);
      }
      .home {
        flex: 0 0 38px;
        margin: 5px 6px 0 2px;
        border-radius: 7px 7px 0 0;
      }
      .home:hover {
        background: var(--tab-hover);
      }
      .home[aria-selected="true"] {
        background: var(--tab-active-bg);
        color: var(--tab-active-fg);
      }
      svg {
        display: block;
      }
      @media (prefers-reduced-motion: no-preference) {
        .close {
          transition: opacity 80ms linear;
        }
      }
    </style>
  </head>
  <body>
    <nav class="strip" data-tauri-drag-region data-testid="tab-strip" aria-label="Tabs">
      <div class="lights" data-tauri-drag-region></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Open projects" data-tauri-drag-region></div>
      <button
        type="button"
        class="home"
        id="home"
        role="tab"
        data-testid="tab-home"
        aria-label="Home"
        title="Home"
        aria-selected="false"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path
            d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H9.5V10h-3v3.5H3a.5.5 0 0 1-.5-.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </nav>
    <script src="strip.js"></script>
  </body>
</html>
