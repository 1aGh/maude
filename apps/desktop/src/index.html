<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maude</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b0c;
        color: #e7e7ea;
        font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        user-select: none;
      }
      .wordmark { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
      .status { color: #8a8a92; font-size: 13px; }
      .retry {
        padding: 6px 16px;
        border: 1px solid #2a2a2e;
        border-radius: 6px;
        background: #161618;
        color: #e7e7ea;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .retry:hover { background: #1d1d20; }
      .spinner {
        width: 22px; height: 22px;
        border: 2px solid #2a2a2e;
        border-top-color: #e7e7ea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      /* Resting tab (V2-1.1 §5.2 "Rest (cap)"): no spinner — nothing is loading. */
      .splash.resting .spinner { display: none; }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="spinner" aria-hidden="true"></div>
      <div class="wordmark" data-testid="splash-name">Maude</div>
      <div class="status" data-testid="splash-status">Starting…</div>
    </main>
    <script>
      // Self-healing splash (#92). This document is the webview's ENTRY
      // document: WKWebView returns here on a content-process crash reload (it
      // reloads the window's ORIGINAL url) and on any uncaught back-navigation.
      // The Rust startup navigate (lib.rs setup) is a one-shot, so without this
      // script any such return parked the app on "Starting…" until a
      // force-quit. On every show, ask Rust for the dev-server URL and replace
      // ourselves with it. The page never chooses or constructs the target —
      // `resolve_dev_server_url` takes no input and returns only a
      // DDR-109-validated loopback URL, or, for a RESTING tab (its server was
      // stopped to keep five running — V2-1.1 §5.2), `{ resting, name }`: the
      // page then names the project and waits. Focusing the tab is what wakes
      // it, and Rust does that navigate itself; this page sends no input.
      (function () {
        var tauri = window.__TAURI__;
        var invoke = tauri && tauri.core && tauri.core.invoke;
        // Opened outside the Tauri shell — stay a static splash, don't throw.
        if (!invoke) return;

        // A FIRST launch legitimately sits here a long time: the dev-server runs
        // boot-self-heal (bun install + build) before it writes `_server.json`.
        // So the "still not up" notice waits well past that normal case rather
        // than crying wolf at every cold start — the silent retry loop below is
        // what actually recovers, and it starts immediately either way.
        var NOTICE_AFTER_MS = 45000;
        var startedAt = Date.now();
        var attempt = 0;
        var inFlight = false;
        var timer = null;
        var noticeShown = false;

        function setStatus(text) {
          var el = document.querySelector('.status');
          if (el) el.textContent = text;
        }

        // textContent only: the name comes from the project's config.
        function showResting(name) {
          var splash = document.querySelector('.splash');
          if (splash) splash.classList.add('resting');
          var word = document.querySelector('.wordmark');
          if (word && name) word.textContent = name;
          setStatus('Opens when you come back to it.');
        }

        function showStarting() {
          var splash = document.querySelector('.splash');
          if (splash && splash.classList.contains('resting')) {
            splash.classList.remove('resting');
            var word = document.querySelector('.wordmark');
            if (word) word.textContent = 'Maude';
            setStatus('Starting…');
          }
        }

        // Escape hatch: name the state and offer a manual kick, so a genuinely
        // wedged boot is VISIBLY stuck rather than silently stuck. The auto
        // retries keep running underneath — this only adds honesty and a nudge.
        function showNotice() {
          if (noticeShown) return;
          noticeShown = true;
          setStatus('Still starting — the local server hasn’t come up yet.');
          var btn = document.createElement('button');
          btn.className = 'retry';
          btn.type = 'button';
          btn.textContent = 'Try again';
          btn.addEventListener('click', function () {
            attempt = 0;
            startedAt = Date.now();
            noticeShown = false;
            setStatus('Starting…');
            btn.remove();
            schedule(0);
          });
          var splash = document.querySelector('.splash');
          if (splash) splash.appendChild(btn);
        }

        // One timer, always — a manual retry must not leave a second loop
        // running alongside the automatic one.
        function schedule(delay) {
          if (timer) clearTimeout(timer);
          timer = setTimeout(recover, delay);
        }

        function recover() {
          timer = null;
          if (inFlight) return;
          inFlight = true;
          attempt += 1;
          invoke('resolve_dev_server_url').then(
            function (answer) {
              // S1.19: this tab's folder is gone (moved or renamed) — the card says so.
              if (answer && typeof answer === 'object' && answer.missing) {
                inFlight = false;
                window.location.replace('root-missing.html');
                return;
              }
              if (answer && typeof answer === 'object' && answer.resting) {
                inFlight = false;
                showResting(String(answer.name || ''));
                // Keep asking, slowly: Rust navigates the tab when focus wakes
                // it, and this is the fallback if that navigate is missed.
                startedAt = Date.now();
                schedule(2000);
                return;
              }
              showStarting();
              // replace(), not href: leave no splash entry in session history
              // for a future back-navigation to land on.
              window.location.replace(String(answer));
            },
            function () {
              inFlight = false;
              if (Date.now() - startedAt > NOTICE_AFTER_MS) showNotice();
              // 300ms → 600ms → 1.2s → capped 2s between attempts. Each invoke
              // itself waits up to RECOVERY_WAIT_MS server-side, so the loop is
              // patient without ever going dead.
              schedule(Math.min(300 * Math.pow(2, attempt - 1), 2000));
            }
          );
        }

        // pageshow fires on a fresh load AND on a WKWebView back-forward-cache
        // restore (where `load` does NOT re-fire) — the back-navigation return
        // path this exists for.
        window.addEventListener('pageshow', function () {
          attempt = 0;
          startedAt = Date.now();
          schedule(0);
        });
      })();
    </script>
  </body>
</html>
