name: Build per-platform binaries

# Phase 3.4 / DDR-015 — build the maude dev-server as a Bun standalone binary on each
# target platform, publish the matching @1agh/maude-<slug> sub-package, then
# (once every binary is uploaded) publish the main @1agh/maude tarball.
#
# Trigger on a v*.*.* tag push. This workflow owns the full release pipeline:
# create-release (empty GH Release) → build-binaries matrix (build + npm publish
# each sub-package + upload binary asset) → publish-main (install with
# regenerated lockfile + npm publish root + populate Release notes).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build but do not publish)'
        type: boolean
        default: false
      skip-desktop-gate:
        description: >-
          BREAK GLASS: publish to npm without waiting for build-desktop's
          blank-window gates. Only for a release that genuinely cannot produce a
          desktop build (e.g. the macOS runner is down). The choice is logged in
          the job summary.
        type: boolean
        default: false

jobs:
  create-release:
    # Create the empty GH Release first so the matrix's `gh release upload`
    # steps have something to attach to. publish-main fills in the body
    # afterwards from CHANGELOG.md (auto-generated if the section is missing).
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry-run != true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Create empty GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists — skipping create"
          else
            gh release create "$GITHUB_REF_NAME" --title "v$VER" --notes "Release in progress…"
          fi

  build-binaries:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            slug: darwin-arm64
            ext: ''
          # darwin-x64 cross-compiled from macos-14 (arm64). bun supports
          # `--target=bun-darwin-x64` from any macOS host and produces a
          # Mach-O 64-bit x86_64 binary. macos-13 was the original choice
          # for native-host parity, but the macos-13 runner is being
          # deprecated and its queue capacity is unreliable (15+ min waits
          # with no runner assignment observed on 2026-05-17).
          - os: macos-14
            target: bun-darwin-x64
            slug: darwin-x64
            ext: ''
          - os: ubuntu-22.04
            target: bun-linux-x64
            slug: linux-x64
            ext: ''
          - os: ubuntu-22.04-arm
            target: bun-linux-arm64
            slug: linux-arm64
            ext: ''
          - os: ubuntu-22.04
            target: bun-linux-x64-musl
            slug: linux-x64-musl
            ext: ''
          - os: ubuntu-22.04-arm
            target: bun-linux-arm64-musl
            slug: linux-arm64-musl
            ext: ''
          - os: windows-2022
            target: bun-windows-x64
            slug: win32-x64
            ext: '.exe'
    # musl targets are cross-compiled from regular glibc ubuntu runners via
    # `bun build --compile --target=bun-linux-*-musl` — bun produces statically
    # linked binaries that don't depend on the host's libc. Previously we ran
    # inside an `alpine:3.20` container, but GitHub Actions can't run JS-based
    # actions (actions/checkout, setup-bun) inside alpine on arm64 runners
    # ("JavaScript Actions in Alpine containers are only supported on x64 Linux
    # runners").
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # EXACT, not '1.3.x' — Bun's minifier output is not stable across
          # patch releases and 1.3.14's client bundle does not run (blank
          # desktop app; see build-desktop.yml for the full note). This job
          # builds the same apps/studio dist that ships to npm.
          bun-version-file: .bun-version

      - name: Verify runtime bundle sizes
        # Same guard as publish-main, run here too because the matrix
        # publishes per-platform sub-packages BEFORE publish-main runs.
        # If committed bundles are defective we want to fail every matrix
        # cell up-front rather than ship broken binaries to npm.
        shell: bash
        run: bash apps/studio/bin/check-runtime-bundles.sh

      - name: Build binary for ${{ matrix.target }}
        shell: bash
        # MAUDE_SKIP_RUNTIME_BUILD=1 — embed git-committed dist/runtime/*.js
        # into the standalone binary verbatim. Without this, every per-platform
        # matrix cell would rebuild dist/runtime/ from its own Bun.build, which
        # is environment-sensitive (v0.22.0 motion regression). Bundles ride
        # along with the binary at compile time, so the same artifacts that
        # ship in the npm tarball ship inside every binary too.
        env:
          MAUDE_SKIP_RUNTIME_BUILD: '1'
        run: |
          cd apps/studio
          # bun.lock IS committed now (2026-08-02) — before that this install
          # re-resolved the whole graph from semver ranges, so the UI that
          # shipped was built against whatever npm served that day. That is the
          # cause the 2026-07-15 runtime-bundle RCA named, and the hole the
          # blank desktop app came through.
          #
          # Still no --frozen-lockfile, for the original reason: a lockfile
          # written on one host records only the optional platform bindings
          # that host saw, so a frozen install on a cross-compile runner pulls
          # the WRONG arch of @oxc-parser/binding-*. A plain install honours the
          # committed resolutions and adds this host's own bindings.
          bun install
          bun run build.ts --release --target=${{ matrix.target }}
          ls -la dist/
          BIN="dist/maude-${{ matrix.slug }}${{ matrix.ext }}"
          if [ ! -f "$BIN" ]; then
            echo "error: expected $BIN not produced" >&2
            exit 1
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "binary size:" && du -h "$BIN"

      - name: Smoke-test binary
        shell: bash
        run: |
          cd apps/studio
          # The dev-server fails loud without a .design/ directory — that's
          # enough to prove the binary executes.
          ./${{ env.BIN }} --root /tmp/nonexistent || echo "expected fail-loud exit code"

      - name: Stage sub-package contents
        shell: bash
        run: |
          DEST="packages/maude-${{ matrix.slug }}"
          cp "apps/studio/${{ env.BIN }}" "$DEST/maude${{ matrix.ext }}"
          chmod +x "$DEST/maude${{ matrix.ext }}" || true
          ls -la "$DEST"

      - name: Publish sub-package
        if: github.event_name == 'push' || inputs.dry-run != true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/maude-${{ matrix.slug }}
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          # Idempotent: if the version is already published (e.g. a retry of
          # a partial release run), treat 409 as success. Any other error
          # still fails the matrix cell.
          set +e
          OUTPUT=$(npm publish --access public --provenance 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qE "(EPUBLISHCONFLICT|cannot publish over|previous version|previously published)"; then
              VER=$(node -p "require('./package.json').version")
              echo "::notice::@1agh/maude-${{ matrix.slug }}@${VER} already published — treating as success"
              exit 0
            fi
            exit $STATUS
          fi

      - name: Dry-run sub-package
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        shell: bash
        run: |
          cd packages/maude-${{ matrix.slug }}
          npm publish --access public --provenance --dry-run

      - name: Upload binary as Release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "apps/studio/${{ env.BIN }}" --clobber || true

  # ── The desktop blank-window gates, in FRONT of npm publish (A6) ────────────
  #
  # THE HOLE THIS CLOSES. `publish-main` used to need only `build-binaries`,
  # while the two gates that catch a packaged app which installs cleanly and
  # then opens to an empty window — `check-bundle-completeness --smoke` (DDR-177)
  # and `check-client-boots` (v0.51.1) — live in build-desktop.yml, a SEPARATE
  # workflow on the same tag. Two workflows racing means npm could (and on a
  # slow desktop leg, would) publish before either gate had run. A gate that the
  # thing it guards can finish ahead of is not a gate.
  #
  # WHY A WAITER AND NOT `needs:`. GitHub Actions has no cross-workflow `needs:`,
  # and moving the macOS Tauri leg into this file would drag the signing and
  # notarization secrets along with it for no benefit. So this job asks the API
  # what build-desktop concluded FOR THIS EXACT SHA and blocks on the answer —
  # which is the same guarantee, stated where the publish can see it.
  #
  # It is deliberately cheap (ubuntu, no checkout of the build tree, no build):
  # all it does is wait and report.
  desktop-gate:
    name: Desktop blank-window gates (blocking npm publish)
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for build-desktop on this SHA
        # Only where there is something to gate. build-desktop fires on
        # `v*.*.*` tags, so on a non-tag dispatch (and on a dry-run, which
        # publishes nothing) no run will ever appear for this SHA and the wait
        # below would burn its full window before failing a release that was
        # never going to publish.
        if: >-
          inputs.skip-desktop-gate != true
          && startsWith(github.ref, 'refs/tags/v')
          && (github.event_name == 'push' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # ~60 min: the macOS leg builds a universal binary and notarizes, and
          # notarization alone is unbounded in principle. Timing out is a
          # REFUSAL, not a pass — see the exit below.
          DEADLINE=$(( SECONDS + 60*60 ))
          echo "Waiting for 'Build desktop app' to conclude for $SHA"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            CONCLUSION=$(gh api \
              "repos/$REPO/actions/workflows/build-desktop.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"' 2>/dev/null || echo "pending")
            STATUS=$(gh api \
              "repos/$REPO/actions/workflows/build-desktop.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0].status // "missing"' 2>/dev/null || echo "missing")
            echo "  status=$STATUS conclusion=$CONCLUSION"
            case "$CONCLUSION" in
              success)
                echo "::notice::build-desktop succeeded — the bundle-completeness and client-boot gates passed."
                exit 0 ;;
              failure|cancelled|timed_out|action_required)
                echo "::error::build-desktop concluded '$CONCLUSION' for $SHA — refusing to publish to npm."
                echo "A packaged app that does not boot is exactly what these gates exist to stop shipping."
                exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::build-desktop did not conclude within the wait window for $SHA."
          echo "Timing out is a REFUSAL: publishing now would mean publishing past an unrun gate."
          exit 1

      - name: Record a break-glass skip
        if: inputs.skip-desktop-gate == true
        shell: bash
        run: |
          {
            echo "### ⚠ Desktop gate SKIPPED (break glass)"
            echo ""
            echo "This release published to npm **without** waiting for"
            echo "\`check-bundle-completeness --smoke\` or \`check-client-boots\`."
            echo "The packaged desktop app is unverified for this version."
            echo ""
            echo "Actor: \`${{ github.actor }}\` · SHA: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::desktop blank-window gates skipped by explicit break-glass input"

  publish-main:
    needs: [build-binaries, desktop-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install Bun
        # `pnpm build` recurses into apps/studio, whose build
        # script invokes `bun run build.ts`. Without Bun on PATH the step
        # fails with `sh: 1: bun: not found`.
        uses: oven-sh/setup-bun@v2
        with:
          # EXACT, not '1.3.x' — Bun's minifier output is not stable across
          # patch releases and 1.3.14's client bundle does not run (blank
          # desktop app; see build-desktop.yml for the full note). This job
          # builds the same apps/studio dist that ships to npm.
          bun-version-file: .bun-version

      - name: Install
        # --no-frozen-lockfile: optionalDependencies on the freshly-published
        # @1agh/maude-<slug>@$VER packages only resolve after the matrix
        # above pushes them to npm. A frozen lockfile cannot enumerate
        # specifiers that didn't exist when the lockfile was last written.
        # The release tag is the integrity boundary; quality.yml runs against
        # the same `--no-frozen-lockfile` (lockfile is still respected when
        # entries are present).
        run: pnpm install --no-frozen-lockfile

      - name: Verify version parity
        run: bash scripts/check-version-parity.sh

      - name: Build
        # MAUDE_SKIP_RUNTIME_BUILD=1 — skip the dist/runtime/*.js regen and
        # ship the bundles committed in git verbatim. v0.22.0 shipped a
        # defective Ubuntu-CI motion_react.js because `pnpm build` ran
        # buildRuntimeBundles() and overwrote the authoritative on-disk
        # artifacts with environment-sensitive Bun.build output. Treating
        # git as the source of truth makes the release platform-agnostic:
        # whatever the maintainer commits is what ships. The next step
        # (Verify runtime bundle sizes) gates the on-disk artifacts so
        # nothing under-sized slips through even if the maintainer commits
        # a bad bundle from their workstation.
        env:
          MAUDE_SKIP_RUNTIME_BUILD: '1'
        run: pnpm build

      - name: Verify runtime bundle sizes
        # Guard against shipping defective /_canvas-runtime/<slug>.js artifacts.
        # Bun.build's output for `motion` + `motion/react` is environment-sensitive
        # — v0.22.0 shipped a 13 kB motion_react.js (working is 155 kB+) that
        # parsed cleanly but threw `ReferenceError: AcceleratedAnimation is not
        # defined` at module-eval time, breaking every canvas using motion.
        # This step asserts each bundle ≥ its declared floor in
        # apps/studio/dist/runtime/.min-sizes.json. Hard-fails
        # the publish before npm sees the bad tarball.
        run: bash apps/studio/bin/check-runtime-bundles.sh

      - name: Verify tarball shape
        run: bash scripts/check-tarball-shape.sh

      - name: Publish main tarball
        if: github.event_name == 'push' || inputs.dry-run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Idempotent: see sub-package publish above for rationale.
        run: |
          set +e
          OUTPUT=$(npm publish --access public --provenance 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qE "(EPUBLISHCONFLICT|cannot publish over|previous version|previously published)"; then
              VER=$(node -p "require('./package.json').version")
              echo "::notice::@1agh/maude@${VER} already published — treating as success"
              exit 0
            fi
            exit $STATUS
          fi

      - name: Dry-run main tarball
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: npm publish --access public --provenance --dry-run

      - name: Populate GitHub Release notes
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES_FILE=""
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              $0 ~ "^## "ver"($| )" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > .release-notes.md
            if [ -s .release-notes.md ]; then NOTES_FILE=".release-notes.md"; fi
          fi
          if [ -z "$NOTES_FILE" ]; then
            # `gh release edit` has no --generate-notes (that flag is create-only),
            # so it printed usage and exited 1 — the whole publish job went red
            # AFTER npm had already published. Ask the API for the generated body
            # and edit it in as a file, which `edit` does support.
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > .release-notes.md || true
            if [ -s .release-notes.md ]; then NOTES_FILE=".release-notes.md"; fi
          fi
          if [ -n "$NOTES_FILE" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            echo "::warning::could not build release notes; leaving the release body as-is"
          fi
