# Read-only pre-deploy check of the Maude Cloud control-plane D1 (manual).
#
# Before a control-plane deploy that migrates D1 (2.0.x: v16 → v20), this reads
# the live schema version, checks foreign keys and prints the Time Travel
# bookmark to restore to. It runs SELECT / PRAGMA only — nothing is written —
# and never deploys. Run it from the Actions tab (workflow_dispatch).
name: Cloud D1 pre-deploy check (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-deploy
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: maude-cloud-control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Schema version
        run: npx --yes wrangler@4 d1 execute "$DB" --remote --json --command "SELECT MAX(version) AS version, COUNT(*) AS applied FROM schema_migrations"
      - name: Foreign-key check (must be empty)
        run: npx --yes wrangler@4 d1 execute "$DB" --remote --json --command "PRAGMA foreign_key_check"
      - name: Row counts (sanity)
        run: |
          npx --yes wrangler@4 d1 execute "$DB" --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM accounts) AS accounts, (SELECT COUNT(*) FROM projects) AS projects, (SELECT COUNT(*) FROM project_members) AS members, (SELECT COUNT(*) FROM project_invites) AS invites"
      - name: Time Travel bookmark (restore point)
        run: npx --yes wrangler@4 d1 time-travel info "$DB" --json
