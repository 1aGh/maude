name: Cell image + data plane

# Builds the tenant cell image and deploys the data-plane Worker.
#
# WHY THIS EXISTS (Cloud Phase 25). Until now both halves were manual: someone
# built `infra/cell/Dockerfile` on a laptop, pushed it to the Cloudflare
# registry, bumped the tag in `apps/cells/wrangler.toml` and ran `wrangler
# deploy`. That was survivable while a cell was a sync relay. It is not now:
# the image carries the build sandbox (Phase 25 A1), so "the code is on main"
# and "the code is in the cells" can differ by a step someone forgot — and the
# difference would be invisible until a customer opened their project.
#
# THE TAG IN wrangler.toml IS THE INSTRUCTION. This workflow reads it, builds
# THAT tag, and deploys. Rolling the fleet is therefore a reviewable one-line
# diff rather than a command someone ran, and re-running this workflow on the
# same commit is a no-op rather than a surprise.
#
# The cell image derives FROM the hub image, so this waits for `hub-image.yml`
# to publish the tag it is built from.
#
# ONLY A RELEASE TAG TOUCHES THE FLEET (added after v0.57.0). A branch push runs
# the data-plane tests and stops there. The reasoning is worth the paragraph,
# because "surely main should also deploy" is the obvious instinct and it is
# what broke production:
#
#   A BRANCH RUN COULD NEVER ROLL THE FLEET. It pushes freshly-built bytes under
#   whatever tag `wrangler.toml` ALREADY declares, and Cloudflare applies
#   container env at instance START — a byte-identical container config is a
#   no-op. So between releases, a branch image push deploys to nobody.
#
#   BUT IT COULD CORRUPT IT. Two runs, two different builds, one tag: exactly
#   the "same tag, different bytes" hazard `apps/hub/src/bundle-identity.mjs`
#   was written about after a rollback landed on a tag CI had overwritten.
#
#   AND IT DERIVED FROM A STALE HUB. `hub-image.yml` runs on tags only, so
#   `maude-hub:latest` is only ever rebuilt at release time. A branch run
#   deriving from `:latest` builds the CELL from the PREVIOUS release's hub —
#   which is how v0.57.0 put a cell carrying a six-day-old hub layer into
#   production with every workflow green. The "wait for the hub image" step
#   cannot catch it: `docker manifest inspect` tests EXISTENCE, and `:latest`
#   always exists, so the wait is satisfied instantly by the wrong image.
#
# Making the image build tag-only removes all three at once, and removes the
# question of whether `:latest` is fresh from the fleet's supply chain entirely
# — the fleet now only ever derives from `maude-hub:<release tag>`.
#
#   AND `wrangler deploy` IS A RELEASE OPERATION TOO — learned the hard way in
#   v0.58.0. The first cut of this change kept the branch run's `wrangler
#   deploy` on the theory that "the Worker is not the image". That is FALSE for
#   this config: `wrangler.toml` NAMES the container image, so a deploy
#   reconciles the container configuration as well as the Worker script. On the
#   release commit — where the bump has already moved the tag to vX.Y.Z but only
#   the tag run builds it — the branch run uploaded the Worker and then failed
#   the rollout with IMAGE_REGISTRY_DOESNT_CONTAIN_IMAGE. Production was
#   untouched (a rejected rollout changes nothing), but it left a half-state and
#   a red run on every release, which is the "green means nothing" noise this
#   workflow exists to delete. So the deploy is tag-gated too, and a branch push
#   is now a TEST run: it proves the tenant mapping still holds and touches
#   nothing.
#
# `:latest` still LAGS for anyone pulling the hub image by hand between
# releases (hub-image.yml remains tag-only). That is a documented cost, not an
# oversight: nothing in the fleet reads it any more.
#
# The escape hatch for an urgent image fix is `workflow_dispatch`, which must
# now name the hub image to derive from. The everyday path is a release —
# `scripts/bump-version.sh` makes that one command.
#
# TOKEN SCOPE — the first run failed here, so it is written down. Rolling the
# fleet needs MORE than deploying a Worker does:
#
#   Account → Workers Scripts: Edit         ← deploying the Worker (shared token has this)
#   Account → Workers Containers: Write     ← pushing to registry.cloudflare.com
#   Account → Cloudchamber: Write           ← rolling the container configuration
#
# Without the last two, `wrangler containers push` returns a bare `Forbidden`
# with no indication of which permission is missing — AFTER the image has built
# perfectly — so the failure reads like a registry outage rather than a token.
#
# `MAUDE_CONTAINERS_TOKEN` is a SEPARATE secret holding exactly those three
# permissions on one account, rather than widening the shared
# `CLOUDFLARE_API_TOKEN` that every other workflow also uses: a token that can
# push images and start containers is a bigger thing to leak than one that can
# deploy a Worker, and there is no reason for the control-plane deploy to carry
# it. The fallback keeps this workflow runnable on a repo that has only the
# shared token — it will fail at the push step, and now it says why.

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths:
      - 'apps/cells/**'
      - 'infra/cell/**'
      - 'apps/hub/**'
      - '.github/workflows/cells-deploy.yml'
  workflow_dispatch:
    inputs:
      hub_image:
        # REQUIRED for a manual run, and deliberately without a default. The
        # default used to be `:latest`, which is the value that made a stale
        # derivation possible — so the manual path now has to state which hub
        # it means rather than inherit the answer that was wrong.
        description: 'Hub image to derive from, e.g. ghcr.io/1agh/maude-hub:v0.57.0'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  # One fleet, one deploy at a time. A superseded run is cancelled — only the
  # newest commit matters, and two overlapping image pushes to the same tag is
  # exactly the ambiguity this workflow exists to remove.
  group: cells-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build cell image + deploy maude-cells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install the data plane's dependencies
        working-directory: apps/cells
        # `wrangler deploy` BUNDLES the Worker, so `@cloudflare/containers`
        # has to be on disk — the deploy is a build, not an upload. Missing
        # this failed with "Could not resolve" only AFTER the image had been
        # built and pushed, which is the expensive half.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Test the data plane
        working-directory: apps/cells
        # The tenant mapping is where a mistake means one tenant reading
        # another's data; it gates the deploy in the same job for the same
        # reason the control plane's tests do.
        run: node --test "*.test.mjs"

      - name: Read the image tag from wrangler.toml
        id: image
        run: |
          IMAGE=$(grep -m1 '^image = ' apps/cells/wrangler.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IMAGE" ]; then
            echo "::error::no image line in apps/cells/wrangler.toml"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Declared cell image: $IMAGE"

      - name: On a release tag, the declared cell image must BE the release
        # The fleet rollout is part of the release since the v30 cycle:
        # `bump-version.sh` rewrites the tag to maude-cell:vX.Y.Z, and this is
        # the loud stop for a hand-rolled release that skipped the bump — a
        # stale tag here would rebuild and re-push the PREVIOUS image name
        # under the new hub, which deploys nothing anywhere (a byte-identical
        # container config never restarts an instance).
        if: github.ref_type == 'tag'
        run: |
          IMAGE="${{ steps.image.outputs.image }}"
          case "$IMAGE" in
            *:"${{ github.ref_name }}") echo "cell tag matches release ${{ github.ref_name }}";;
            *) echo "::error::apps/cells/wrangler.toml declares '$IMAGE' but the release is '${{ github.ref_name }}' — run scripts/bump-version.sh (it rewrites the cell tag) and re-tag"; exit 1;;
          esac

      - name: Resolve the hub image to derive from
        id: hub
        # NO `:latest` FALLBACK — see the header. Either this is a release tag
        # (derive from that release's hub) or it is a manual run that said which
        # hub it means. There is no third case that should produce an image.
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            HUB="ghcr.io/1agh/maude-hub:${{ github.ref_name }}"
          elif [ -n "${{ inputs.hub_image }}" ]; then
            HUB="${{ inputs.hub_image }}"
          else
            echo "::error::a manual run must name the hub image to derive from (input: hub_image)"
            exit 1
          fi
          echo "hub=$HUB" >> "$GITHUB_OUTPUT"
          echo "Deriving from: $HUB"

      - name: Wait for the hub image to exist
        # hub-image.yml runs on the same tag; the cell image is FROM it, so a
        # race here would fail with an unhelpful "manifest unknown".
        #
        # Now that the tag is VERSION-PINNED, existence does imply freshness —
        # `maude-hub:v0.57.0` cannot appear carrying v0.56.0's bytes. That was
        # never true of `:latest`, which is why this wait proved nothing before.
        #
        # THE BUDGET IS MEASURED, NOT GUESSED. `hub-image.yml` builds
        # linux/amd64 + linux/arm64 under QEMU: the v0.57.0 run took ~16 min.
        # The old 40 × 15s = 10 min gave up SIX MINUTES before the image it was
        # waiting for existed. 90 × 20s = 30 min leaves real headroom — waiting
        # costs a runner minute, giving up costs a release.
        if: ${{ steps.hub.outputs.hub != '' }}
        run: |
          for i in $(seq 1 90); do
            if docker manifest inspect "${{ steps.hub.outputs.hub }}" >/dev/null 2>&1; then
              echo "hub image is available"; exit 0
            fi
            echo "attempt $i: not yet"; sleep 20
          done
          echo "::error::the hub image never appeared — cannot build the cell image"
          exit 1

      - uses: docker/setup-buildx-action@v4
        if: ${{ steps.hub.outputs.hub != '' }}

      - name: Build the cell image into the local daemon
        # Gated on the resolve step having produced a hub: a branch push never
        # builds an image (header). `github.ref_type == 'tag'` is named here as
        # well as upstream so the guard is readable at the step that matters.
        if: ${{ steps.hub.outputs.hub != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/cell/Dockerfile
          build-args: HUB_IMAGE=${{ steps.hub.outputs.hub }}
          # The container platform runs amd64; building arm64 as well doubles
          # the time for an image nothing pulls on that architecture.
          platforms: linux/amd64
          # Loaded, not pushed: `wrangler containers push` does the push, and
          # it needs the tag present in the local daemon.
          load: true
          push: false
          tags: ${{ steps.image.outputs.image }}

      - name: Record what this image sealed
        id: sealed
        # The image writes `/app/bundle-manifest.json` at build time (the E1
        # seal — apps/hub/src/bundle-identity.mjs). Reading it HERE, out of the
        # image this run just built, is what lets the post-deploy gate below
        # compare the live fleet against THIS artifact rather than against a
        # hash someone typed. `--entrypoint cat` because the image's entrypoint
        # is tini and we want the file, not a server.
        if: ${{ steps.hub.outputs.hub != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        env:
          # Through `env:`, never interpolated straight into the shell. The
          # value comes from a `grep`/`sed` over apps/cells/wrangler.toml, and
          # `${{ }}` splices text into the script BEFORE bash sees it — so a
          # crafted image line would be executed rather than quoted. Low blast
          # radius (it needs write access to a file that already names the image
          # the fleet runs), but the mitigation is one line.
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          MANIFEST=$(docker run --rm --entrypoint cat "$IMAGE" /app/bundle-manifest.json)
          # `/health` reports 12-char prefixes — long hashes in a health payload
          # are noise that hides the answer — so compare on the same prefix.
          CLIENT=$(echo "$MANIFEST" | jq -r '.artifacts["dist/client.bundle.js"] // empty' | cut -c1-12)
          if [ -z "$CLIENT" ]; then
            echo "::error::the built image has no sealed client hash — bundle-manifest.json is missing or malformed"
            exit 1
          fi
          echo "client=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "This image serves client.bundle.js $CLIENT"

      - name: Push it to the Cloudflare registry
        # Same gate as the build. This is the step that could produce two sets
        # of bytes under one tag, which is the failure `bundle-identity.mjs`
        # exists to detect after the fact — better not to generate it.
        if: ${{ steps.hub.outputs.hub != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAUDE_CONTAINERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # NOT `docker login registry.cloudflare.com` — that registry does not
        # take an account id and an API token as a username/password pair, and
        # a plain docker push 401s (which is how this workflow failed the first
        # time it ran). The managed registry is R2-backed and authenticates
        # through Wrangler, which is also what Cloudflare documents for CI.
        run: npx --yes wrangler@4 containers push "${{ steps.image.outputs.image }}"

      - name: Deploy the data plane
        # Tag-gated for the same reason the image build is: `wrangler.toml` names
        # the container image, so this reconciles the container configuration —
        # it cannot succeed on a commit whose declared image only the tag run
        # builds. See the header.
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        working-directory: apps/cells
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAUDE_CONTAINERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `wrangler deploy` reconciles ROUTES, and tenant hostnames are created
        # per project at provision time — which is why this config declares
        # none (see apps/cells/wrangler.toml's own header). Nothing here may
        # add one.
        run: npx --yes wrangler@4 deploy

      - name: Verify a cell answers
        # A deploy that returns 0 has uploaded a script. This asks the one
        # question that matters: does a real tenant's cell still serve?
        #
        # Only after a MANUAL deploy. A release tag gets the much harder check
        # in the next step, and a branch push no longer deploys anything — so
        # probing a cell there would assert nothing about this run.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          URL="${{ vars.CELL_HEALTH_URL || 'https://alligators.cloud.maude.sh/health' }}"
          for i in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 15 "$URL" || true)
            echo "attempt $i: ${BODY:-<no response>}"
            case "$BODY" in
              *'"ok":true'*) echo "verified"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::no cell answered /health after the deploy"
          exit 1

      - name: Verify the fleet is RUNNING this release
        # GREEN MUST MEAN "THE FLEET ANSWERS ON THE RELEASED VERSION".
        #
        # Before this step, `cells-deploy` green meant "an image was pushed and
        # a Worker was deployed" — both true during the v0.57.0 release, which
        # put a cell carrying a six-day-old hub layer into production. Finding
        # that out took hand-probing production, and the first probe was
        # MISREAD: `GET /api/documents` → 401 reads like "exists, needs auth"
        # but is the blanket answer for any unknown path. Nobody should need
        # that trick, so the workflow does it, and it asserts TWO things:
        #
        #   releaseVersion — which RELEASE the running bytes are from. This is
        #                    the one that catches a stale underlying layer: the
        #                    v0.57.0 image was perfectly self-consistent, so a
        #                    hash check alone would have passed it.
        #   client hash    — WHICH BYTES, compared against the seal this run
        #                    read out of the image it pushed. This catches "same
        #                    tag, different bytes" (bundle-identity.mjs).
        #
        # Neither subsumes the other; they fail on different things.
        #
        # THE PROBE HOST IS A REAL TENANT CELL, deliberately. A synthetic or
        # hub-level probe can be perfectly healthy while every tenant is broken,
        # and a gate that passes while customers are down is worse than no gate.
        # `CELL_HEALTH_URL` overrides it if that tenant is ever retired.
        #
        # THE BUDGET IS GENEROUS ON PURPOSE. The first request after a roll pays
        # a cold start — rehydrate from R2, which the release guide warns is
        # MINUTES on a GB-scale project. 60 × 20s = 20 min. A flaky gate is a
        # gate someone disables, and this one is only useful if it is trusted.
        # The loop itself lives in `scripts/verify-fleet-release.sh` so it can be
        # tested against a stubbed responder (scripts/test/verify-fleet-release.test.mjs)
        # rather than only proving itself on a real release.
        if: ${{ github.ref_type == 'tag' }}
        # Same rule as above: through `env:`, not spliced into the script.
        env:
          HEALTH_URL: ${{ vars.CELL_HEALTH_URL || 'https://alligators.cloud.maude.sh/health' }}
          RELEASE_TAG: ${{ github.ref_name }}
          SEALED_CLIENT: ${{ steps.sealed.outputs.client }}
        run: bash scripts/verify-fleet-release.sh "$HEALTH_URL" "$RELEASE_TAG" "$SEALED_CLIENT"
