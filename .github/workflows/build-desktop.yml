name: Build desktop app (macOS .dmg + Windows .msi + Linux .deb)

# Phase 26 / DDR-106 — build the Maude native shell (Tauri v2) into installers.
# Phase 32 / Task 2 — extended to a macOS + Windows matrix with auto-update
# artifacts. Linux (.deb) added as a third leg — Tauri renders the UI through
# WebKitGTK there (not WKWebView/WebView2), and the leg installs the WebKitGTK
# 4.1 toolchain before `tauri build`. Linux has no Gatekeeper/SmartScreen, so
# the .deb is unsigned by design.
#
# Why .deb and not AppImage: Tauri's AppImage bundler runs linuxdeploy, whose
# gtk plugin resolves shared-lib deps for every ELF in the AppDir via `ldd`.
# Our Bun-compiled `maude-server` sidecar is effectively statically linked, so
# `ldd` exits 1 ("not a dynamic executable") and the pinned linuxdeploy 1-alpha
# treats that as fatal (core dump, exit 134) — see the verbose log on run
# 28083203877. The .deb bundler touches neither linuxdeploy nor ldd (it just
# packages the binary + resources and auto-generates the libwebkit2gtk Depends),
# and .deb is the native Ubuntu format anyway. Trade-off: .deb does NOT
# self-update (only AppImage carries the updater artifact). Re-introducing a
# self-updating AppImage means shipping a newer linuxdeploy into the tauri cache
# that tolerates the static sidecar — tracked as a follow-up.
# Sidecar binaries for linux-x64 already ship from build-binaries.yml.
#
# Each leg bundles the compiled dev-server binary as a Tauri sidecar. Build order
# is load-bearing: the dev-server binary must exist at apps/studio/dist/maude-<slug>
# BEFORE `tauri build` runs, because the desktop app's `beforeBuildCommand`
# (scripts/sync-sidecar.mjs) copies it into src-tauri/binaries/maude-server-<triple>
# for Tauri's `externalBin`.
#
# macOS ships a UNIVERSAL binary (`tauri build --target universal-apple-darwin`)
# rather than a second arm64/x86_64 matrix leg, because Tauri's default
# `.app.tar.gz` updater artifact carries no arch token in its filename — two
# legs would silently clobber each other's upload to the same GitHub Release.
# Tauri's own universal-binary support only fat-binaries the main Rust
# executable (which cargo compiles for both arches itself); it does NOT
# auto-lipo `externalBin` sidecars (tauri-apps/tauri#3355) — it looks for a
# pre-built binary literally named `<name>-universal-apple-darwin` and fails
# to bundle otherwise. So the macOS leg builds both dev-server sidecar arches,
# stages the dev-server + agent-browser + maude-CLI sidecars for each arch,
# then runs `lipo -create` itself to produce `maude-server-universal-apple-darwin`
# + `agent-browser-universal-apple-darwin` + `maude-universal-apple-darwin`
# before `tauri build` runs. (All three are `externalBin` entries in
# tauri.conf.json — DDR-166 added the third, `binaries/maude`, the CLI itself.)
#
# Two signing keys are in play (Phase 32):
#   • TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) — ed25519 key that signs the UPDATER
#     artifacts (createUpdaterArtifacts:true). The matching public key is pinned in
#     tauri.conf.json → plugins.updater.pubkey; the client refuses an update whose
#     signature doesn't verify. Required on BOTH legs for auto-update to work.
#   • Platform code-signing — APPLE_* (macOS notarization) / WINDOWS_CERTIFICATE
#     (Authenticode). When absent the build still succeeds and produces an UNSIGNED
#     installer (dev distribution); SmartScreen/Gatekeeper will warn. This mirrors
#     the phase-26 graceful-degradation contract.
#
# MAUDE_SKIP_RUNTIME_BUILD=1 is mandatory (per CLAUDE.md): embed the git-committed
# dist/runtime/*.js verbatim instead of regenerating them.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach installers + updater artifacts to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64 host; builds a universal (arm64+x86_64) binary — target/sidecar_dist
            label: macos-universal # are irrelevant here (both arches are hardcoded in the build step below)
            sidecar_slug: darwin-arm64
            artifact_name: maude-desktop-macos-universal
            bundle_glob: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-2022
            label: windows-x64
            target: bun-windows-x64
            sidecar_slug: win32-x64
            sidecar_dist: dist/maude-win32-x64.exe
            artifact_name: maude-desktop-windows-x64
            bundle_glob: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04 # oldest supported runner = widest glibc baseline for the .deb
            label: linux-x64
            target: bun-linux-x64
            sidecar_slug: linux-x64
            sidecar_dist: dist/maude-linux-x64
            artifact_name: maude-desktop-linux-x64
            bundle_glob: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # EXACT, not '1.3.x'. Bun's minifier output is not stable across patch
          # releases, and one of those outputs does not run: 1.3.14 built a
          # client bundle whose React dispatcher is null by the time a hook
          # runs, so the packaged app opened to a blank window (v0.51.1, and
          # again on the first v0.52.0 build — caught by check-client-boots).
          # 1.3.3 produces a bundle that is byte-identical to the committed
          # dist/client.bundle.js and renders. Same class as the environment-
          # sensitive dist/runtime/*.js output CLAUDE.md warns about; here the
          # cheap answer is a fixed toolchain rather than a committed artifact,
          # because unlike the runtime bundles this one changes with source.
          # Bumping it is fine — the client-boot gate will say if it is not.
          bun-version-file: .bun-version

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace deps
        # --no-frozen-lockfile: the optionalDependencies bootstrap pins the 7
        # @1agh/maude-<platform> sub-packages at the release version, which the
        # committed lockfile can't enumerate until the build-binaries matrix
        # publishes them (mirrors build-binaries.yml > publish-main + vercel.json).
        run: pnpm install --no-frozen-lockfile

      - name: Build dev-server sidecar binary
        # Embed the committed dist/runtime/*.js verbatim (MAUDE_SKIP_RUNTIME_BUILD=1).
        # macOS builds BOTH arches (arm64 + x86_64) — the "Build Tauri app" step
        # below lipos them into a universal binary before `tauri build` runs;
        # every other OS still builds its single matrix.target.
        shell: bash
        env:
          MAUDE_SKIP_RUNTIME_BUILD: '1'
          # Windows packages the COMMITTED client bundle rather than its own.
          # With Bun pinned, bun.lock committed and sources LF-normalised, macOS
          # and Linux both emit 1,977,006 B — identical to the reviewed artifact.
          # Bun on Windows emits 1,976,621 B from those same inputs. The bundle
          # is platform-independent JavaScript, so a per-OS rebuild can only
          # differ, never improve, and a differently-emitted bundle is precisely
          # what opened a blank window in v0.51.1 and v0.52.0.
          MAUDE_SKIP_CLIENT_BUILD: ${{ matrix.os == 'windows-2022' && '1' || '' }}
        run: |
          cd apps/studio
          # bun.lock IS committed (2026-08-02). Not --frozen-lockfile on purpose:
          # a lockfile written on one host records only that host's optional
          # platform bindings, and a frozen install on a cross-compile runner
          # would pull the wrong arch of @oxc-parser/binding-*. A plain install
          # honours the committed resolutions and adds this host's own.
          bun install
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            bun run build.ts --release --target=bun-darwin-arm64
            bun run build.ts --release --target=bun-darwin-x64
            test -f dist/maude-darwin-arm64 || { echo "::error::dev-server binary not produced at apps/studio/dist/maude-darwin-arm64"; ls -la dist; exit 1; }
            test -f dist/maude-darwin-x64 || { echo "::error::dev-server binary not produced at apps/studio/dist/maude-darwin-x64"; ls -la dist; exit 1; }
          else
            bun run build.ts --release --target=${{ matrix.target }}
            test -f "${{ matrix.sidecar_dist }}" || { echo "::error::dev-server binary not produced at apps/studio/${{ matrix.sidecar_dist }}"; ls -la dist; exit 1; }
          fi

      # The client bundle that just got REBUILT must be the one that was
      # reviewed. Bun's minifier output is not stable across patch releases —
      # 1.3.14 produced a bundle whose React dispatcher is null by the time a
      # hook runs, so the packaged app opened to a blank window. On macOS the
      # client-boot gate below catches that by actually rendering; Windows and
      # Linux have no such gate and shipped a blank .msi/.deb for v0.52.0 before
      # this step existed.
      #
      # With Bun pinned exactly, this build is reproducible: the output equals
      # the committed dist/. A difference means the toolchain moved (or somebody
      # changed client source without running the release-minified rebuild
      # CLAUDE.md requires) — either way a human must look before it ships.
      - name: Built client bundle matches the committed one
        shell: bash
        run: |
          if ! git diff --quiet -- apps/studio/dist/client.bundle.js apps/studio/dist/styles.css; then
            echo "::error::the client bundle CI just built differs from the committed one"
            git diff --stat -- apps/studio/dist/client.bundle.js apps/studio/dist/styles.css
            echo "Either the Bun pin moved (this build is no longer reproducible) or a"
            echo "client source change was committed without the release-minified rebuild:"
            echo "  cd apps/studio && MAUDE_SKIP_RUNTIME_BUILD=1 bun run build.ts --release"
            echo "  git add dist/client.bundle.js dist/styles.css"
            echo "Do not paper over this by deleting the check — v0.51.1 and v0.52.0 both"
            echo "shipped a blank desktop app through exactly this gap."
            exit 1
          fi
          echo "client bundle is byte-identical to the committed artifact"

      # ── macOS: build + notarize (when APPLE_* present) ──────────────────────────
      - name: Build Tauri app (.dmg)
        if: matrix.os == 'macos-14'
        env:
          MAUDE_SIDECAR_SLUG: ${{ matrix.sidecar_slug }}
          # tauri-bundler auto-appends --skip-jenkins to bundle_dmg.sh whenever
          # CI=true (tauri-apps/tauri issue #592) — GitHub Actions sets CI=true
          # on every runner, so every CI-built .dmg silently skipped the whole
          # Finder-prettifying AppleScript step (background image, icon
          # positioning, hiding .background/.VolumeIcon.icns) since the
          # drag-to-Applications background shipped in v0.44.0. This override
          # opts back into running it — GitHub's hosted macOS runners support
          # the Finder-automation osascript call without a TCC prompt.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          # Updater signing (ed25519) — produces the .app.tar.gz.sig the feed serves.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing + notarization (absent → unsigned .dmg).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # sync-kg.mjs talks to api.github.com, whose UNAUTHENTICATED quota is
          # 60/h shared across every job on the runner's IP — the v0.49.1 tag run
          # got through, a dispatch 40 minutes later got `403`. Any token lifts
          # the ceiling to 5000/h (the pinned kgai release is a public repo, so
          # the default GITHUB_TOKEN's scope is irrelevant — it just authenticates).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Stage BOTH arches' sidecars, then fuse each into a single
          # `<name>-universal-apple-darwin` binary via lipo BEFORE `tauri build`.
          # Tauri does NOT auto-lipo externalBin sidecars for a
          # --target universal-apple-darwin build (that auto-lipo only applies
          # to the main Rust binary, which cargo compiles for both arches
          # itself) — it looks for a pre-built binary literally named
          # `<name>-universal-apple-darwin` and fails to bundle otherwise
          # (see tauri-apps/tauri#3355). So we build the fat binary ourselves.
          cd apps/desktop
          MAUDE_SIDECAR_SLUG=darwin-arm64 node scripts/sync-sidecar.mjs
          MAUDE_SIDECAR_SLUG=darwin-arm64 bun scripts/build-cli-binary.mjs
          MAUDE_SIDECAR_SLUG=darwin-arm64 node scripts/sync-agent-browser.mjs
          MAUDE_SIDECAR_SLUG=darwin-x64 node scripts/sync-sidecar.mjs
          MAUDE_SIDECAR_SLUG=darwin-x64 bun scripts/build-cli-binary.mjs
          MAUDE_SIDECAR_SLUG=darwin-x64 node scripts/sync-agent-browser.mjs
          # kgai engine — a RESOURCE, not an externalBin sidecar (kgai publishes
          # no Windows build, and externalBin is a static all-platforms
          # requirement). So Tauri neither lipos nor signs it: we do both.
          MAUDE_KG_NO_ALIAS=1 MAUDE_SIDECAR_SLUG=darwin-arm64 node scripts/sync-kg.mjs
          MAUDE_KG_NO_ALIAS=1 MAUDE_SIDECAR_SLUG=darwin-x64 node scripts/sync-kg.mjs
          # Staging dir, NOT src-tauri/resources — `stage-resources.mjs` (run by
          # tauri's own beforeBuildCommand, i.e. AFTER this step) wipes that tree
          # and copies .kg-staging/ in.
          if [ -f .kg-staging/kg-aarch64-apple-darwin ] \
             && [ -f .kg-staging/kg-x86_64-apple-darwin ]; then
            lipo -create -output .kg-staging/kg \
              .kg-staging/kg-aarch64-apple-darwin \
              .kg-staging/kg-x86_64-apple-darwin
            chmod +x .kg-staging/kg
            rm -f .kg-staging/kg-*-apple-darwin
            # Notarization requires every Mach-O in the bundle to carry a
            # Developer-ID signature + hardened runtime. libkuzu ships universal
            # already; both still need signing (DDR-190).
            #
            # ⚠ The identity is NOT in any keychain yet at this point. Tauri
            # imports APPLE_CERTIFICATE into a temporary keychain of its own,
            # but only inside `tauri build` — which runs BELOW this block. So a
            # bare `codesign --sign "$APPLE_SIGNING_IDENTITY"` here dies with
            # "error: The specified item could not be found in the keychain."
            # and takes the whole macOS leg with it (v0.48.0 → v0.49.1 shipped
            # NO macOS build for exactly this). We therefore stand up our own
            # short-lived keychain, sign, and tear it down again — leaving a
            # clean slate so tauri's later import can't hit an ambiguous
            # duplicate identity across two search-list keychains.
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
              KG_KEYCHAIN="$RUNNER_TEMP/maude-kg-signing.keychain-db"
              KG_KEYCHAIN_PW="$(openssl rand -base64 24)"
              KG_P12="$RUNNER_TEMP/maude-kg-cert.p12"
              ORIG_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
              security create-keychain -p "$KG_KEYCHAIN_PW" "$KG_KEYCHAIN"
              security set-keychain-settings -lut 21600 "$KG_KEYCHAIN"
              security unlock-keychain -p "$KG_KEYCHAIN_PW" "$KG_KEYCHAIN"
              printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$KG_P12"
              security import "$KG_P12" -k "$KG_KEYCHAIN" \
                -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
              rm -f "$KG_P12"
              # Restore the search list + drop the keychain even if a codesign
              # below fails — otherwise a failed run leaves tauri's own import
              # facing a stray duplicate identity.
              # shellcheck disable=SC2064
              trap "security list-keychains -d user -s $ORIG_KEYCHAINS; security delete-keychain '$KG_KEYCHAIN' 2>/dev/null || true" EXIT
              # Without a partition list every codesign call blocks on a GUI
              # "allow access" prompt — which on a headless runner is a hang.
              security set-key-partition-list -S apple-tool:,apple:,codesign: \
                -s -k "$KG_KEYCHAIN_PW" "$KG_KEYCHAIN" >/dev/null
              # shellcheck disable=SC2086
              security list-keychains -d user -s "$KG_KEYCHAIN" $ORIG_KEYCHAINS
              codesign --force --timestamp --options runtime \
                --keychain "$KG_KEYCHAIN" \
                --sign "$APPLE_SIGNING_IDENTITY" .kg-staging/libkuzu.dylib
              codesign --force --timestamp --options runtime \
                --keychain "$KG_KEYCHAIN" \
                --sign "$APPLE_SIGNING_IDENTITY" .kg-staging/kg
              codesign --verify --strict .kg-staging/libkuzu.dylib
              codesign --verify --strict .kg-staging/kg
              # Tear down early (the trap is only the failure path) so tauri's
              # later import starts from the pre-existing keychain state.
              trap - EXIT
              # shellcheck disable=SC2086
              security list-keychains -d user -s $ORIG_KEYCHAINS
              security delete-keychain "$KG_KEYCHAIN"
            else
              codesign --force -s - .kg-staging/libkuzu.dylib
              codesign --force -s - .kg-staging/kg
            fi
          else
            echo "::warning::kgai engine not staged for both arches — the .app ships without the graph"
          fi
          cd src-tauri/binaries
          lipo -create -output maude-server-universal-apple-darwin \
            maude-server-aarch64-apple-darwin maude-server-x86_64-apple-darwin
          lipo -create -output agent-browser-universal-apple-darwin \
            agent-browser-aarch64-apple-darwin agent-browser-x86_64-apple-darwin
          lipo -create -output maude-universal-apple-darwin \
            maude-aarch64-apple-darwin maude-x86_64-apple-darwin
          cd ../../../..

          # Graceful-degradation: with no Apple cert secret configured the env
          # vars above arrive as EMPTY STRINGS (not unset), which still makes
          # tauri's macOS bundler attempt `security import` on an empty cert and
          # fail ("failed to import keychain certificate"). Unset them so tauri
          # ad-hoc-signs an UNSIGNED .dmg (dev distribution) instead. Updater
          # signing (TAURI_SIGNING_PRIVATE_KEY) is unaffected.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          # MAUDE_SKIP_KG_SYNC=1 is load-bearing HERE, macOS only. tauri's
          # `beforeBuildCommand` runs `sync-kg.mjs` itself — and this step's
          # MAUDE_SIDECAR_SLUG (darwin-arm64) with no MAUDE_KG_NO_ALIAS would
          # make that run re-download the THIN arm64 engine and `copyFileSync`
          # it over `.kg-staging/kg` — silently replacing the universal binary
          # we just lipo'd AND signed with an unsigned single-arch one, moments
          # before stage-resources copies it into the bundle. Notarization would
          # then reject it (or ship an x86_64-broken app). Skipping leaves our
          # prepared staging dir untouched; stage-resources only ever copies.
          MAUDE_SKIP_KG_SYNC=1 pnpm --filter @maude/desktop tauri build --target universal-apple-darwin

          # tauri notarizes + staples the .app, but only *signs* the .dmg
          # container (it is NOT notarized). A browser-downloaded (quarantined)
          # unnotarized dmg still trips Gatekeeper on mount ("Apple cannot check
          # it for malicious software"), so notarize + staple the dmg itself.
          # Only in the signed path — the unset above clears APPLE_CERTIFICATE
          # in the unsigned/dev path, so this is skipped there.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            DMG=$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
            echo "Notarizing dmg container: $DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          fi

      # ── Bundle self-containment gate (DDR-177) ──────────────────────────────
      # Assert the packaged .app runs every `maude design <verb>` on a machine
      # with NO node/bun/claude (--smoke uses a stripped PATH) — the exact class
      # that shipped broken through v0.44–v0.45 (ACP "Working…" hang + every
      # helper "helper not found"/"bun required"/missing happy-dom/svgo). macOS
      # only: --smoke runs the real bundled binaries. Blocks the release on a gap.
      - name: Verify bundle self-containment (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -eu
          APP=$(ls -d apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app 2>/dev/null | head -1 || true)
          if [ -z "$APP" ]; then echo "::error::no .app found for the bundle-completeness gate"; exit 1; fi
          echo "Gate target: $APP"
          node apps/desktop/scripts/check-bundle-completeness.mjs "$APP" --smoke

      # A complete bundle can still open to a blank window. v0.51.1 shipped
      # exactly that: no crash, no log, just an empty webview — because the fault
      # only appears when `window.__TAURI__` is present (so every browser check
      # is green) and only in the MINIFIED bundle (so `tauri dev` is green, and
      # so is the committed dist/, since client.bundle.js is REGENERATED here at
      # package time with no gate on the result). This boots the bundled sidecar
      # and asserts the UI actually mounts.
      - name: Verify the packaged UI renders (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -eu
          APP=$(ls -d apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app 2>/dev/null | head -1 || true)
          if [ -z "$APP" ]; then echo "::error::no .app found for the client-boot gate"; exit 1; fi
          node apps/desktop/scripts/check-client-boots.mjs "$APP"

      # ── Windows: build + Authenticode sign (when WINDOWS_CERTIFICATE present) ────
      - name: Build Tauri app (.msi)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          MAUDE_SIDECAR_SLUG: ${{ matrix.sidecar_slug }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            Write-Host "Importing Authenticode certificate from WINDOWS_CERTIFICATE"
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            [IO.File]::WriteAllBytes("$PWD\cert.pfx", $bytes)
            $securePwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath "$PWD\cert.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd
            Remove-Item "$PWD\cert.pfx"
            # Inject the thumbprint via a --config override (avoids committing it).
            $signConf = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
            } } } | ConvertTo-Json -Depth 6
            Set-Content -Path "apps/desktop/sign.conf.json" -Value $signConf
            pnpm --filter @maude/desktop tauri build --config sign.conf.json
          } else {
            Write-Host "WINDOWS_CERTIFICATE not set — producing an UNSIGNED .msi"
            pnpm --filter @maude/desktop tauri build
          }

      # ── Linux: install the WebKitGTK toolchain, then build (.deb) ───────────────
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Tauri v2's documented Ubuntu prerequisites. webkit2gtk-4.1 is the v2
          # webview (4.0 is v1); libayatana-appindicator3 backs the tray. The deb
          # bundler reads these to auto-generate the package's Depends.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            file

      - name: Build Tauri app (.deb)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          MAUDE_SIDECAR_SLUG: ${{ matrix.sidecar_slug }}
          # tauri.conf.json sets createUpdaterArtifacts:true + an updater pubkey,
          # so Tauri requires the matching private key as a global precondition
          # even though .deb is NOT an updater target (only AppImage is) — without
          # it the build errors "public key found, but no private key" AFTER the
          # .deb is already bundled. Supplying the key satisfies the check; no
          # updater artifact is produced for .deb, so the package stays unsigned
          # (Linux has no Gatekeeper/Authenticode equivalent).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Linux DOES fetch kgai (a linux-x86_64 prebuilt exists) — via tauri's
          # own beforeBuildCommand rather than an explicit step. Same 60/h
          # unauthenticated api.github.com quota, same coin flip. (Windows needs
          # no token: kgai publishes no win32 build, so sync-kg exits before its
          # first API call.)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Restrict to the deb target (config is targets:"all"): the AppImage
          # bundler trips on the static Bun sidecar via linuxdeploy/ldd (see the
          # header comment), and rpm would need rpmbuild tooling. deb is the
          # native Ubuntu package and needs neither.
          pnpm --filter @maude/desktop tauri build --bundles deb

      - name: Locate primary installer
        id: installer
        shell: bash
        run: |
          FILE="$(ls ${{ matrix.bundle_glob }} 2>/dev/null | head -1)"
          test -n "$FILE" || { echo "::error::no installer matched ${{ matrix.bundle_glob }}"; exit 1; }
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "built: $FILE"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Attach installers + updater artifacts to GitHub Release
        # Attach the user-facing installer AND the updater artifacts (.sig + the
        # .app.tar.gz / signed installer the feed serves). The /releases edge
        # function (site/app/releases/...) reads these off the release.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
