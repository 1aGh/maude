name: Version parity check

# No paths filter — this is a required status check, so it must run on every
# PR. Removing the filter would skip the check on most PRs and leave them
# blocked forever (a required check that never runs is never satisfied).
# The script is fast (<5s) so unconditional execution is fine.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  parity:
    name: Version parity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: bash scripts/check-version-parity.sh
