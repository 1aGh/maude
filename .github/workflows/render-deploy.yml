# maude-render image + service deploy (DDR-230).
#
# Mirrors cells-deploy.yml's contract, because it exists for the same reasons:
#
#   1. THE TAG IN apps/render/wrangler.toml IS THE INSTRUCTION. This workflow
#      reads it, builds THAT tag, and deploys. Pushing new bytes under an
#      unchanged tag rolls nobody — a byte-identical container config is a
#      no-op (`no changes`), and it can only put a SECOND set of bytes under an
#      existing tag (the bundle-identity hazard). `scripts/bump-version.sh`
#      rewrites the tag at release time.
#   2. ONLY A RELEASE TAG (or an explicit workflow_dispatch) touches the
#      registry or the Worker. A branch push runs the checks and stops.
#   3. TOKEN SCOPE — same three permissions as the cells (Workers Scripts:
#      Edit, Workers Containers: Write, Cloudchamber: Write), same
#      MAUDE_CONTAINERS_TOKEN secret, same bare-`Forbidden` failure mode when
#      one is missing.
#
# One extra output the cells don't have: the image ALSO publishes to
# ghcr.io/1agh/maude-render:<tag> — that is the self-hosted sidecar
# (workspace-up --render pulls it by MAUDE_IMAGE_TAG). Both consumers carry the
# SAME build, which is the point of building once; since M10 they share it as a
# REGISTRY DIGEST rather than a local daemon tag, because the sidecar has to be
# multi-arch (amd64 + arm64, like maude-hub) and `load:` only takes one
# platform. GHCR is published first, Cloudflare is fed the amd64 child of that
# exact digest.

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths:
      - 'apps/render/**'
      - 'apps/studio/exporters/**'
      - '.github/workflows/render-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build maude-render + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Parse-check the service
        # The service's export logic is the studio's exporters (tested there);
        # this catches a syntax/import break before the expensive image build.
        run: bun build apps/render/server.ts --target=bun --no-bundle > /dev/null

      - name: Token-proxy contract tests
        # Pins the header-normalization contract (hybrid-export T1): the proxy
        # must never replay Bun-fetch's decompressed-body-with-stale-headers
        # Response — the bug that made every v1.0.x export die as goto:Timeout.
        # Deliberately tests apps/render/proxy.ts standalone: server.ts's boot
        # assert exits under credential-shaped env (GITHUB_TOKEN on runners).
        run: bun test apps/render/test

      - name: Read the image tag from wrangler.toml
        id: image
        run: |
          IMAGE=$(grep -m1 '^image = ' apps/render/wrangler.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IMAGE" ]; then
            echo "::error::no image line in apps/render/wrangler.toml"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Declared render image: $IMAGE"

      - name: On a release tag, the declared image must BE the release
        if: github.ref_type == 'tag'
        run: |
          IMAGE="${{ steps.image.outputs.image }}"
          case "$IMAGE" in
            *:"${{ github.ref_name }}") echo "render tag matches release ${{ github.ref_name }}";;
            *) echo "::error::apps/render/wrangler.toml declares '$IMAGE' but the release is '${{ github.ref_name }}' — run scripts/bump-version.sh and re-tag"; exit 1;;
          esac

      - name: Set up QEMU (arm64 emulation)
        # The arm64 half of the release build runs emulated. It is slow — the
        # Playwright/Chromium layer especially — and that is the price of the
        # self-hoster on a t4g box getting an image that starts at all.
        if: ${{ github.ref_type == 'tag' }}
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

      - name: Log in to ghcr
        if: ${{ github.ref_type == 'tag' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ONE `docker build` per release, still — but now the REGISTRY is where
      # the two consumers meet, not the local daemon.
      #
      # The old shape built amd64 with `load: true` and retagged that local
      # image to ghcr. The invariant it protected was right ("two builds, one
      # version" is the same-tag-different-bytes hazard across registries), but
      # `load:` can only take a SINGLE platform into the daemon, so the shape
      # also pinned the self-host sidecar to amd64 — on the arm64 instance our
      # own AWS runbook recommends, `--render` could not start (M10).
      #
      # Inverted, the invariant holds MORE strictly: buildx publishes the
      # manifest list, and Cloudflare is handed the amd64 bytes FROM THAT
      # DIGEST. Both consumers now share a registry digest rather than a local
      # daemon tag.
      - name: Build the render image (multi-arch) and publish the self-host sidecar
        id: build
        if: ${{ github.ref_type == 'tag' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/render/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/1agh/maude-render:${{ github.ref_name }}

      - name: The published sidecar must be a manifest list covering both architectures
        # The half of this workflow that had no gate. The Worker probe below
        # verifies the Cloudflare consumer; nothing verified the one a
        # self-hoster pulls, so it shipped amd64-only through every release
        # since DDR-230 without a red check anywhere.
        if: ${{ github.ref_type == 'tag' }}
        run: |
          GHCR="ghcr.io/1agh/maude-render:${{ github.ref_name }}"
          PLATFORMS=$(docker buildx imagetools inspect --raw "$GHCR" \
            | jq -r '.manifests[]?.platform | select(.architecture != "unknown") | "\(.os)/\(.architecture)"')
          echo "$GHCR publishes: ${PLATFORMS:-<not a manifest list>}"
          for want in linux/amd64 linux/arm64; do
            echo "$PLATFORMS" | grep -qx "$want" || {
              echo "::error::$GHCR does not publish $want — a self-hoster on that architecture gets 'exec format error'"
              exit 1
            }
          done

      - name: Build the render image (dispatch lane — Cloudflare only)
        # A manual run off a non-tag ref never touches ghcr (see the header's
        # rule 2), so there is nothing to pull by digest: build the one platform
        # Cloudflare runs, straight into the daemon.
        if: ${{ github.ref_type != 'tag' && github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/render/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.image }}

      - name: Push to the Cloudflare registry
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        working-directory: apps/render
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAUDE_CONTAINERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # BY DIGEST, not by tag: the exact index just published, and the
            # amd64 child of it. Cloudflare Containers run amd64 — handing them
            # a manifest list would be a different bug, quieter than this one.
            SRC="ghcr.io/1agh/maude-render@${DIGEST}"
            docker pull --platform linux/amd64 "$SRC"
            docker tag "$SRC" "$IMAGE"
          fi
          npm install --no-audit --no-fund
          npx wrangler containers push "$IMAGE"

      - name: Deploy the Worker
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        working-directory: apps/render
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAUDE_CONTAINERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAUDE_RENDER_VERSION: ${{ github.ref_name }}
        run: npx wrangler deploy --var MAUDE_RENDER_VERSION:"$MAUDE_RENDER_VERSION"

      - name: Roll the container instances to the just-deployed image
        # `wrangler deploy` reconciles the container CONFIG but does NOT restart
        # the running instances — Cloudflare keeps serving the previous image
        # until a rolling replacement is forced. So /_health kept reporting the
        # prior version and the verify below timed out on EVERY release (the
        # container-roll gap the fleet runbook flags for cells applies here too).
        # Force a rolling replacement, then verify. Uses the Cloudflare API
        # directly — wrangler has no instance-level roll, and the containers
        # token carries Cloudchamber:Write.
        #
        # TARGET THE RELEASE IMAGE EXPLICITLY, never the read-back
        # `configuration.image`. That field reflects the last SUCCESSFULLY
        # ROLLED config, not what `wrangler deploy` just wrote — on this fleet
        # it sat pinned at an OLD tag (v1.0.4) across v1.0.5/6/7, so a rollout
        # that re-used `$cfg.image` rolled the container straight back to the
        # stale image while /_health still reported the new version from the
        # `--var` (the version string tracks the env, NOT the running image).
        # Net effect: the proxy-header fix built into v1.0.6 never actually ran
        # in prod — exports kept timing out — until a manual roll to the tag's
        # image. Rolling to the DECLARED image (steps.image.outputs.image, i.e.
        # the wrangler.toml tag) is what makes the verify below mean "the new
        # bits are live," not "the env var changed."
        if: ${{ github.ref_type == 'tag' }}
        env:
          CF_TOKEN: ${{ secrets.MAUDE_CONTAINERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/containers/applications"
          AUTH="Authorization: Bearer $CF_TOKEN"
          APP=$(curl -sf -H "$AUTH" "$API" | jq -r '.result[] | select(.name|test("maude-render")) | .id' | head -1)
          if [ -z "$APP" ]; then echo "::error::maude-render container application not found"; exit 1; fi
          # Preserve sizing from the live config, but OVERRIDE the image with the
          # release target (the whole point of the roll).
          CFG=$(curl -sf -H "$AUTH" "$API/$APP" | jq '.result.configuration')
          echo "rolling maude-render ($APP) to $TARGET_IMAGE (config still reports $(echo "$CFG" | jq -r '.image'))"
          BODY=$(jq -n --argjson cfg "$CFG" --arg image "$TARGET_IMAGE" '{
            description: "release rollout to the just-deployed image",
            strategy: "rolling", step_percentage: 100, kind: "full_auto",
            target_configuration: {
              image: $image,
              vcpu: ($cfg.vcpu // 0.5),
              memory_mib: ($cfg.memory_mib // 4096),
              disk: { size_mb: ($cfg.disk.size_mb // 8000) },
              observability: { logs: { enabled: true } }
            }
          }')
          OK=$(curl -sf -X POST -H "$AUTH" -H "content-type: application/json" -d "$BODY" "$API/$APP/rollouts" | jq -r '.success')
          [ "$OK" = "true" ] || { echo "::error::rollout request was not accepted"; exit 1; }
          echo "rollout accepted — instances replacing with $TARGET_IMAGE"

      - name: Verify the service answers at the release version
        if: ${{ github.ref_type == 'tag' }}
        # 15 min, not 5: the rollout above is ACCEPTED immediately but the ~3 GB
        # Chromium image takes minutes to pull + boot to healthy, so a 5-min
        # window raced the roll and failed the verify while the new instance was
        # still starting (the container reported the previous version until it
        # flipped). The version poll IS the completion check — give it room.
        run: |
          for i in $(seq 1 90); do
            BODY=$(curl -sf https://render.cloud.maude.sh/_health || true)
            if echo "$BODY" | jq -e --arg v "${{ github.ref_name }}" '.ok and .version == $v' >/dev/null 2>&1; then
              echo "render service is live at ${{ github.ref_name }}"; exit 0
            fi
            echo "attempt $i: $BODY"; sleep 10
          done
          echo "::error::the render service never reported the release version — the rollout did not land"
          exit 1
