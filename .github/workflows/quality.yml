name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run for the old head: cancel it rather than
# let a ~40 min run finish for a commit nobody will merge (during the 2.0.4
# release four of them queued behind each other). Pushes to main are never
# cancelled — every main commit keeps its own record.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Does this change reach code the studio suite tests? A PR that touches only
  # the public site, the .ai/ workspace or top-level Markdown skips the shards
  # (the Quality job still runs in full, site build included). Anything else —
  # and every push to main — runs them. Deliberately a short allow-list: a path
  # missing from it costs a few minutes, a path wrongly on it costs a bug.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      studio: ${{ steps.paths.outputs.studio }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "studio=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: the studio suite runs"
            exit 0
          fi
          other=$(git diff --name-only "$BASE"...HEAD | grep -vE '^(site/|\.ai/)|^[^/]+\.md$' || true)
          if [ -z "$other" ]; then
            echo "studio=false" >> "$GITHUB_OUTPUT"
            echo "only site/, .ai/ or top-level Markdown changed: the studio suite is skipped"
          else
            echo "studio=true" >> "$GITHUB_OUTPUT"
            echo "studio-relevant changes (first 20):"
            echo "$other" | head -20
          fi

  quality:
    name: Quality (lint+test+links)
    runs-on: ubuntu-latest
    # A hung test must fail in minutes, not sit to GitHub's 6 h job limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # build-stats.mjs reads git tags + shortlog + per-file log

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'    # pnpm 11 requires Node >=22.13 (engines.node ">=20" is the CLI runtime constraint, not the build constraint)
          cache: pnpm

      - name: Install
        # See build-binaries.yml `Install` step for rationale: the per-platform
        # @1agh/maude-<slug> packages are an optionalDependencies pattern
        # that bootstraps through release time, so the lockfile cannot
        # enumerate all 7 specifiers between releases. Lockfile is still
        # respected when entries are present.
        run: pnpm install --no-frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Install Bun (harness tests + cloud-binary gate)
        # Before Test: `pnpm test` ends in test:harness, whose source audit runs
        # under `bun test` (`bun: not found` once this step sat after it). The
        # cloud-binary gate below also compiles apps/studio twice with Bun.
        # Same EXACT pin as build-binaries/build-desktop:
        # Bun's minifier output is not stable across patch releases (see the
        # rationale on build-desktop.yml's Install Bun step).
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Test (node:test)
        run: pnpm test

      - name: Release pipeline invariants (scripts/test, node:test)
        # The release pipeline's own assertions: the stable-vs-rc tag split and
        # the prerelease channel (V2-2.0 — release-channel, bump-version in a
        # throwaway repo, the updater feed's channel rules), the v0.57.0 fleet
        # invariants and the post-deploy verifier. None of these ran in any
        # workflow before; an assertion nobody runs guards nothing.
        run: node --test scripts/test/*.test.mjs

      - name: Data-plane tests (apps/cells)
        # Cloud Phase 24 B1. `cellEnv` is where a mistake means one tenant
        # reading another's data, and it had no tests and no CI at all — the
        # control plane's suite ran in the (now gone) cloud-deploy.yml, but
        # nothing ever ran the cells half. The deploy repo (1aGh/maude-deploy)
        # runs them again right before it deploys.
        working-directory: apps/cells
        run: node --test --test-force-exit "*.test.mjs"

      - name: Containment invariant (DDR-193)
        # The CI half of "enforced, not asserted". The boot-assert in
        # apps/studio/workspace-mode.ts refuses to start a cell that exposes a
        # rendering/evaluating surface; this catches the change that would make
        # that possible, at review time. The realistic way this invariant is
        # lost is not an argument against it — it's a refactor quietly dropping
        # a line while every test stays green.
        run: |
          bash scripts/check-containment.sh
          sh -n infra/cell/entrypoint.sh

      - name: Cloud binary elimination (Phase 27 D1)
        # Containment says a cell REFUSES these surfaces; this says the code is
        # not in the image, which is the claim DDR-123 actually makes. Two
        # compiles for the host arch (~1 min), and the assertion is a PAIR:
        # each sentinel present in the desktop binary, absent from the cloud
        # one — because absence alone is also what a typo'd sentinel looks like.
        # `bun install` first: apps/studio resolves its own bun.lock (DDR-009),
        # independent of the root pnpm install above.
        run: |
          (cd apps/studio && bun install --frozen-lockfile)
          bash scripts/check-cloud-binary.sh

      - name: Studio typecheck (tsc) + checker coverage
        # REQUIRED. No CI job ran `tsc` at all until v1.0.0's gate set, and
        # apps/studio/tsconfig.json's hand-written `include` had no `*.tsx`
        # entry — 52 tracked files, `canvas-lib.tsx` among them, were reached by
        # no checker whatsoever. The coverage script is the ratchet: it asserts
        # `tsc --listFiles` still covers every tracked non-test source, so the
        # surface cannot silently shrink back. Toolchain is already installed by
        # the cloud-binary gate above (Bun + `bun install` in apps/studio).
        run: |
          (cd apps/studio && bunx tsc --noEmit)
          bash scripts/check-tsc-coverage.sh

      - name: Sync-lane tests (required)
        env:
          # DDR-054 §2a makes the sync runtime REFUSE to start when it sees
          # CI/GITHUB_ACTIONS — a real safety property (a runner carrying
          # GITHUB_TOKEN must never be talked onto a PR-controlled hub), and the
          # guard's own message names this override. Without it `createSyncRuntime`
          # returns null and every sync test asserts against `undefined`: the
          # first run of these jobs took ~30 sync tests down that way, which
          # looked like the file plane was broken and was really the gate doing
          # its job to a test runner. Safe here — this runs `bun test`, never
          # `maude design serve`, and sync-hardening.test.ts deletes the variable
          # per-test so the gate itself stays covered.
          MAUDE_SYNC_IN_CI: '1'
        # REQUIRED, and deliberately narrower than the full studio suite. The
        # file plane is the newest and least-exercised code in the tree and it
        # carries data custody over a transport the threat model calls
        # untrusted; ~43 files, ~30 s. `dist/` is checked before AND after
        # because a `bun test` run in this tree has been observed regenerating
        # unminified dev bundles over the committed release artifacts — whatever
        # is committed is what ships, so a clobber must fail the build, not be
        # discovered at release time.
        run: |
          git diff --quiet -- apps/studio/dist/ \
            || { echo "::error::apps/studio/dist/ was already dirty before the tests ran"; exit 1; }
          (cd apps/studio && bun test --isolate test/sync-*.test.ts --timeout 20000)
          git diff --quiet -- apps/studio/dist/ || {
            echo "::error::apps/studio/dist/ was modified by the test run — the committed release bundles were clobbered."
            git --no-pager diff --stat -- apps/studio/dist/
            exit 1
          }

      - name: Hub backup restore drill
        # The exit gate for Cloud Phase 2 Task 3. A backup nobody has restored
        # is a hypothesis: a database that restores readable-but-EMPTY looks
        # exactly like a working one until the day you need it. So CI takes a
        # real snapshot of a seeded hub and asserts the RESTORED database —
        # integrity_check, document count, and a named sentinel document with a
        # non-empty payload. Uses a file:// target; the S3/R2 code path is
        # covered by apps/hub/test/backup.test.mjs against a live S3-shaped
        # server.
        run: bash scripts/hub-restore-drill.sh

      - name: Tarball shape
        run: bash scripts/check-tarball-shape.sh

      - name: Version parity
        run: bash scripts/check-version-parity.sh

      # T0d′ (post-1.0 backlog): per-PR, not only inside bump-version.sh. ~/git
      # is a Syncthing tree with concurrent sessions — a `git add` of a shared
      # file can carry another session's in-flight import into main while the
      # module itself stays untracked (green locally, fatal in CI; cost two tag
      # moves in v0.51.0). Catch it on the PR, not at release time.
      - name: Import coherence (tracked imports resolve to tracked files)
        run: bash scripts/check-import-coherence.sh

      - name: MDCC tokens drift (.design ↔ site/app)
        run: pnpm --filter @maude/site sync:tokens:check

      # V2-2.6: the studio's generated token copies (maude-v2 client ladder + canvas HUD block)
      - name: Studio token drift (scripts/gen-tokens.mjs)
        run: node scripts/gen-tokens.mjs --check

      # S10.13 (S10 Q4): both in-repo systems stay at schema level 0 — an edit to colors_and_type.css that skips
      # `ds-check --emit` turns `manifest-stale` (level 10) red here, not at the next release.
      - name: Design-system schema (maude + maude-v2 at level 0)
        run: node cli/bin/maude.mjs design ds-check maude maude-v2

      - name: Site generated content drift (reference + stats + lib mirrors)
        # The whole generated set, not a subset: site/lib/whats-new.json sat
        # outside this gate and went stale through the v1.0.0 release (the
        # public feed still advertised 0.60.7). Its generator — and
        # build-roadmap.mjs — had a clock-based `generated` field that made
        # every regen dirty, which is WHY they were left out; both are now
        # deterministic functions of their inputs, so they can be diffed here.
        run: |
          pnpm --filter @maude/site gen:reference
          pnpm --filter @maude/site gen:stats
          pnpm --filter @maude/site gen:roadmap
          pnpm --filter @maude/site gen:whatsnew
          # V2-2.4 — the action registry's generated files (canvas keymap, native menu slice).
          node scripts/gen-actions.mjs --check
          DRIFT_PATHS="site/content/docs/commands-design site/content/docs/commands-flow site/content/docs/config-schema.mdx site/lib/stats.json site/lib/roadmap.json site/lib/whats-new.json"
          if ! git diff --quiet -- $DRIFT_PATHS; then
            echo "::error::Generated site content is stale. Run \`pnpm --filter @maude/site gen:reference && pnpm --filter @maude/site gen:stats && pnpm --filter @maude/site gen:roadmap && pnpm --filter @maude/site gen:whatsnew\` locally and commit the diff."
            git --no-pager diff --stat -- $DRIFT_PATHS
            exit 1
          fi

      - name: Site build (validates fumadocs MDX + Next compile)
        run: pnpm --filter @maude/site build

  export-lanes:
    # REQUIRED. DDR-231 Phase 2 T7 — the end-to-end export gate.
    #
    # Every export check that existed before this one tested a LAYER, and all of
    # them were green while a real cloud export shipped the artboard's title bar
    # into the file and dropped every photo. This job boots a real
    # workspace-shaped studio and a real maude-render, drives the real Export
    # dialog in Chromium, and asserts the BYTES that come back — for the browser
    # lane (png/svg/pptx) and the worker lane (pdf incl. print boxes, html,
    # png/svg/pptx as the fallback path, and mp4/webm/gif).
    #
    # It is fast (~30 s of test time) and it is the only check that looks at a
    # finished artifact, so it blocked from the start — the full studio suite
    # below only became blocking once its clean-CI health was measured (V2-2.13).
    name: Export lanes E2E (browser + worker)
    runs-on: ubuntu-latest
    # Hang guard — see the quality job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install (apps/studio, own bun.lock per DDR-009)
        run: cd apps/studio && bun install --frozen-lockfile

      # The capture + render paths drive a real browser. The npm package and its
      # ~150 MB binary are separate installs (see bin/_pw-launch.mjs), and only
      # the binary makes these tests meaningful.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Export lanes E2E + capture hygiene
        # Same dist clobber guard as the sync lane: a `bun test` run in this tree
        # has been observed regenerating the committed release bundles.
        run: |
          git diff --quiet -- apps/studio/dist/ \
            || { echo "::error::apps/studio/dist/ was already dirty before the tests ran"; exit 1; }
          cd apps/studio && bun test --isolate \
            test/export-e2e-lanes.test.ts \
            test/export-capture-hygiene.test.ts \
            test/export-capture-fidelity.test.ts \
            test/export-format-scope-coherence.test.ts \
            --timeout 600000
          cd .. && git diff --quiet -- apps/studio/dist/ || {
            echo "::error::apps/studio/dist/ was modified by the test run — the committed release bundles were clobbered."
            git --no-pager diff --stat -- apps/studio/dist/
            exit 1
          }

  studio-shard:
    # REQUIRED since V2-2.13 (2026-10-09). It ran non-blocking first, on
    # purpose: the full apps/studio suite had never run in any workflow, local
    # figures were taken on a loaded laptop (which fabricates failures), and
    # blocking on an unmeasured suite would either stall every PR or teach
    # everyone to ignore a red check. Its job was to produce the CLEAN data that
    # names the quarantine list — and the data is in:
    #
    #   - 200 runs of this job, 2026-09-09 → 10-09. Every test that failed in
    #     them is fixed: the deterministic ones (import-asset/import-brand SVG
    #     canary without agent-browser, fs-watch, exporters/jobs, canvas-shell
    #     TLA on Node 22, canvas-lib-graph, acp-activity-endpoint) by #135 and
    #     the fixes before it; the fs.watch flakes (comments-fs-rebroadcast,
    #     active-state, git-watch) and the cross-file leak in sync-autocommit by
    #     #144 (bun 1.3.3 → 1.4.2, `--isolate`).
    #   - Every main push since 2026-10-06 10:23 (e2bc5ce6) is green here — 16
    #     in a row, 6641 pass / 0 fail at 6651 tests.
    #   - The `/_api/figma/import` cluster was never the import tests (all 9
    #     passed in every completed run): it was figma-routes.test.ts's
    #     afterAll — `killProc` waited without a bound on a server that took
    #     SIGTERM and never exited (26 runs, 09-11 → 09-21, dormant since).
    #     killProc now escalates to SIGKILL after 5 s and says so in the log
    #     (test/helpers-killproc.test.ts).
    #
    # So the quarantine list is EMPTY, and this job fails the run like any
    # other. A test that starts flaking here is a defect to fix or to quarantine
    # BY NAME in this comment — never a reason to put `continue-on-error` back.
    #
    # Branch protection still lists only "Quality (lint+test+links)" and
    # "Version parity check" as required contexts; making "Studio suite (full)"
    # a merge gate is a repo-settings change for the owner (V2-2.13 hand-back).
    #
    # Since 2026-11-05 the suite runs as 6 parallel shards instead of one
    # ~36 min `bun test`: scripts/studio-shard.mjs balances the files by their
    # measured run time (scripts/studio-test-timings.json) and leaves out the
    # sync lane, which the Quality job above already runs. Each shard numbers its
    # files in the log ([41/303] …), refuses to pass if it ran fewer files than
    # it was given, and writes a step summary. The "Studio suite (full)" job
    # below merges the shards and is the one status to read.
    name: Studio suite shard ${{ matrix.index }}/6
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    # Hang guard — see the quality job. 40, not 30: the tests take ~6 min, but
    # a slow apt mirror can spend most of 20 min in the Chromium step.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'  # the shell TLA probe needs SourceTextModule#hasTopLevelAwait (Node 24)
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install (apps/studio, own bun.lock per DDR-009)
        run: cd apps/studio && bun install --frozen-lockfile

      # The FULL suite includes `export-capture-fidelity.test.ts`, which drives a
      # real browser — so this job needs the same chromium the export-lanes job
      # installs. Without it the run died with `Playwright's Chromium browser
      # isn't installed` and exit 3, which read as "the suite is red" when the
      # suite had not finished running. A missing browser measures nothing — and
      # now that this job is required, it would block every PR for nothing.
      # Browser downloads are cached, keyed on the lockfiles that pin Playwright
      # and agent-browser. Every install step has its own timeout and one retry:
      # in Nov 2026 these two steps took 20–30 min on a slow runner network and
      # ran the shard out of its 30-minute budget before a single test ran.
      - name: Cache browser downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.agent-browser/browsers
          key: browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/studio/bun.lock') }}

      # The slow part is apt (`--with-deps`): the Azure Ubuntu mirror once took
      # 4 min for a single font package. A timed-out attempt leaves apt-get
      # running and holding the dpkg lock, so a retry first waits for it.
      - name: Install Chromium
        timeout-minutes: 20
        run: |
          for attempt in 1 2; do
            timeout 600 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed or timed out"
            while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 5; done
          done
          exit 1

      # SVG import's execution canary (DDR-167) renders every imported file in
      # a network-denied agent-browser session — a security control, so it
      # fails closed without the binary and the import routes 500. Use the
      # pinned devDep of @maude/desktop (DDR-144) and fetch its Chrome. The
      # system libraries came with the Chromium step above (`--with-deps`), so
      # this step only downloads the browser, and not again on a cache hit.
      - name: Install agent-browser
        timeout-minutes: 12
        run: |
          echo "$GITHUB_WORKSPACE/apps/desktop/node_modules/.bin" >> "$GITHUB_PATH"
          for attempt in 1 2; do
            timeout 300 apps/desktop/node_modules/.bin/agent-browser install && exit 0
            echo "::warning::agent-browser install attempt $attempt failed or timed out"
          done
          exit 1

      - name: Studio suite (this shard)
        env:
          MAUDE_SYNC_IN_CI: '1' # see the required sync-lane step in the job above
        # Same dist clobber guard as the required sync lane above: a clobbered
        # bundle fails the run here too. The runner is the full-suite invocation
        # `bun test --isolate --timeout 20000` over this shard's files.
        run: |
          git diff --quiet -- apps/studio/dist/ \
            || { echo "::error::apps/studio/dist/ was already dirty before the tests ran"; exit 1; }
          node scripts/studio-shard-run.mjs --total 6 --index ${{ matrix.index }} --out shard-${{ matrix.index }}.json
          git diff --quiet -- apps/studio/dist/ || {
            echo "::error::apps/studio/dist/ was modified by the test run — the committed release bundles were clobbered."
            git --no-pager diff --stat -- apps/studio/dist/
            exit 1
          }

      - name: Design plugin hooks (bun test)
        if: matrix.index == 1
        # V2-2.4b — `maude design hook <event>` against a fixture studio over the real agent
        # RouteSpecs, so it needs apps/studio installed (this job). Neither `pnpm test`
        # (cli/**) nor the studio suite reaches plugins/ — scripts/test/quality-gates.test.mjs
        # fails when a plugins/ test file has no `bun test` step here.
        run: bun test plugins/design/hooks

      - name: Keep this shard's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-shard-${{ matrix.index }}
          path: shard-${{ matrix.index }}.json
          if-no-files-found: ignore
          retention-days: 14

  # The one status for the whole suite, under the job name branch protection and
  # every watcher already use. It fails when any shard failed or never reported,
  # and passes when the changes job decided the suite was not needed.
  studio-suite:
    name: Studio suite (full)
    needs: [changes, studio-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Was the suite needed?
        id: gate
        env:
          STUDIO: ${{ needs.changes.outputs.studio }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGES" = "success" ] && [ "$STUDIO" = "false" ]; then
            echo "Only site/, .ai/ or top-level Markdown changed, so the studio suite was not needed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          pattern: studio-shard-*
          path: shard-results
          merge-multiple: true

      - name: Merge the shards
        if: steps.gate.outputs.run == 'true'
        run: node scripts/studio-shard-summary.mjs shard-results --total 6 --timings-out studio-test-timings.json

      # This run's per-file times: copy the file over scripts/studio-test-timings.json
      # when the plan (`node scripts/studio-shard.mjs --total 6 --plan`) drifts out of balance.
      - name: Keep the timing table
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-timings
          path: studio-test-timings.json
          if-no-files-found: ignore
          retention-days: 30

  control-plane:
    name: Control-plane tests (apps/cloud)
    # Until 2026-11 these ran only in cloud-deploy.yml, i.e. only on a push to
    # main that touched apps/cloud — and that push WAS a production deploy (a
    # Dependabot auto-merge deployed the billing Worker, security review
    # 2026-11-03, X8). The deploy moved to the private 1aGh/maude-deploy and is
    # dispatched by release tag; the tests run here on every push so a broken
    # control plane is red at review time, with no credential in reach. Its own
    # job because node:sqlite (the tests' stand-in for the D1 binding) needs
    # Node 24 — 32 of them fail on the quality job's Node 22 — and the deploy
    # repo reruns them against the exact commit it deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test (node:test)
        working-directory: apps/cloud
        run: node --test "*.test.mjs"
