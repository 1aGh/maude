name: Publish hub image

# Phase 9 Task 7 — build the self-hostable Maude hub as a multi-arch
# (amd64 + arm64) Docker image and push it to GHCR on every v*.*.* release tag.
#
# Image: ghcr.io/1agh/maude-hub:vX.Y.Z + :latest
# Build context is the REPO ROOT since Cloud Phase 16 — the bundler stage needs
# apps/studio/sync/autocommit.ts (the single-source append-only commit engine).

on:
  push:
    # Stable releases only (V2-2.0): `v*.*.*` alone also matches
    # `v2.0.0-rc.1`; the negation keeps every prerelease away from the hub
    # image and its `:latest`. scripts/test/release-channel.test.mjs holds the
    # split.
    tags: ['v*.*.*', '!v*.*.*-*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build only, do not push'
        type: boolean
        default: false
      tag:
        # OPTIONAL. Empty is the normal case: the build publishes `:latest` and
        # nothing else. Give a value to ALSO publish under a name you choose
        # (e.g. `staging`, `drill-1`) when you want a second, addressable
        # reference to this exact build — which is what a fleet drill needs,
        # since `cells-deploy` derives its cell from a named hub image.
        description: 'Extra tag to publish alongside :latest (optional, e.g. staging)'
        required: false
        default: ''

jobs:
  hub-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: A prerelease tag never publishes the hub image
        # V2-2.0 (T21'). The tag filter above already excludes prereleases;
        # this is the same rule read at the step, so widening the filter later
        # cannot quietly move `maude-hub:latest` (what every self-hoster
        # pulls) onto rc code. Release candidates ship through build-binaries
        # (npm `next`) and build-desktop (prerelease) only.
        if: github.ref_type == 'tag' && contains(github.ref_name, '-')
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::$REF is a prerelease tag — maude-hub:latest and :vX.Y.Z are stable releases only"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.dry-run != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          # `:latest` ALWAYS — it is what the deploy emitter defaults to and what
          # every self-hoster pulls, so it tracks the newest build by design.
          #
          # The version tag comes from the REF only on a tag push. It used to be
          # computed unconditionally as `${GITHUB_REF_NAME#v}`, which on a manual
          # run from main resolved to the literal string `main` and published
          # `ghcr.io/1agh/maude-hub:vmain` — a tag nobody asked for, from a ref
          # that is not a version. A dispatch now publishes `:latest` alone
          # unless it is given an explicit name to use.
          TAGS="ghcr.io/1agh/maude-hub:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            TAGS="ghcr.io/1agh/maude-hub:v${VER},${TAGS}"
          elif [ -n "${EXTRA_TAG}" ]; then
            case "$EXTRA_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "::error::--tag may only contain [A-Za-z0-9._-]: '${EXTRA_TAG}'"; exit 1 ;;
            esac
            TAGS="ghcr.io/1agh/maude-hub:${EXTRA_TAG},${TAGS}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.dry-run != true }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
