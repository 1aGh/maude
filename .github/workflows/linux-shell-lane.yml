# #208 (D12: Linux is a supported target) — the Linux shell lane.
#
# On Linux Tauri packs every child webview into the window's GtkBox, and `set_bounds` does nothing there, so
# the strip took the top half of the window and the studio the bottom half. tabs.rs now packs the children
# itself (`gtk_pack` / `pack_child`); this lane proves it on a real GTK: it builds the debug harness
# `examples/shell_lane.rs` (the REAL `tabs::ensure_shell` + `tabs::add_tab`, nothing else of the app), opens
# the shell under Xvfb, paints the strip green and the tab magenta, and checks where GTK put each webview and
# what the window's pixels show — as opened, after a resize, and with the tab overview open and closed again
# (`src/shell_lane.rs` `judge`). The pictures are uploaded as an artifact either way.
#
# No sidecar, no bundle, no network beyond the toolchain: the externalBin and resource paths tauri-build checks
# are stubbed, because the harness never spawns them. It is also the first place a pull request compiles the
# desktop crate for Linux at all (build-desktop.yml's .deb build runs on release tags only).
name: Linux shell lane

on:
  push:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/strip.*'
      - '.github/workflows/linux-shell-lane.yml'
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/strip.*'
      - '.github/workflows/linux-shell-lane.yml'

permissions:
  contents: read

concurrency:
  group: linux-shell-lane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-lane:
    name: Shell layout on GTK (Xvfb)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install WebKitGTK + Xvfb
        working-directory: .
        run: |
          sudo apt-get update
          # The same build prerequisites as build-desktop.yml's .deb job, plus a virtual display.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            file \
            xvfb \
            dbus-x11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: linux-shell-lane

      - name: Stub the sidecars and resources tauri-build checks
        run: |
          # tauri.conf.json bundle.externalBin + bundle.resources must exist for the build script; the harness
          # never runs or reads them.
          triple=x86_64-unknown-linux-gnu
          mkdir -p binaries
          for b in maude-server agent-browser maude; do
            printf '#!/bin/sh\nexit 1\n' > "binaries/$b-$triple"
            chmod +x "binaries/$b-$triple"
          done
          for d in apps/studio cli plugins/design plugins/flow plugins/kgai kgai; do
            mkdir -p "resources/$d" && touch "resources/$d/.stub"
          done
          echo '{}' > resources/package.json

      - name: Build the harness
        run: cargo build --locked --example shell_lane

      - name: Run the lane
        env:
          MAUDE_SHELL_LANE_OUT: ${{ runner.temp }}/shell-lane
          # No DRM device under Xvfb: WebKit composites in software.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          NO_AT_BRIDGE: '1'
        run: |
          timeout 240 xvfb-run -a -s '-screen 0 1920x1080x24' \
            dbus-launch --exit-with-session target/debug/examples/shell_lane

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-shell-lane
          path: ${{ runner.temp }}/shell-lane
          if-no-files-found: warn
          retention-days: 14
