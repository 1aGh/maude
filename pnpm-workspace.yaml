packages:
  # The root package (@1agh/maude) is the sole npm publisher.
  # Listed here so Changesets can resolve it as a workspace member.
  - "."
  - site
  - apps/studio
  - apps/hub
  - apps/desktop
  # Desktop E2E harness (WebdriverIO @wdio/tauri-service). Its own member so its
  # deps install; no `build` script → skipped by the root `build` fan-out, and the
  # root `test` doesn't fan out to packages. See the `desktop-e2e` skill.
  - apps/desktop/e2e
# The root package's optionalDependencies pin the 7 per-platform @1agh/maude-<slug> binaries
# at the release version. They are for npm USERS of the published package — never for this
# workspace: at release time they are not on npm yet, so the lockfile went stale after every
# release and every later local `pnpm` run rewrote it; and once installed here, `maude design
# serve` in the dev tree silently ran the published binary instead of the source (V2-2.x,
# 2026-10-09). Ignored for workspace installs; the published manifest is unchanged.
ignoredOptionalDependencies:
  - '@1agh/maude-darwin-arm64'
  - '@1agh/maude-darwin-x64'
  - '@1agh/maude-linux-arm64'
  - '@1agh/maude-linux-arm64-musl'
  - '@1agh/maude-linux-x64'
  - '@1agh/maude-linux-x64-musl'
  - '@1agh/maude-win32-x64'

# pnpm 9+ requires explicit opt-in for postinstall scripts.
# Biome ships native binaries via @biomejs/cli-* optional deps; the postinstall
# is the official install path. Enable.
# esbuild + sharp are pulled in by site/ (Next.js 16 + Tailwind v4):
#   - esbuild: Next.js dev server bundling
#   - sharp:   Next.js image optimization (`next/image`)
# Both ship native binaries via the same postinstall pattern.
allowBuilds:
  '@biomejs/biome': true
  # agent-browser (devDep of @maude/desktop, DDR-144) ships its per-platform
  # binaries IN the npm tarball, so its postinstall isn't needed to obtain them —
  # deny it. sync-agent-browser.mjs stages the one platform binary at build time.
  agent-browser: false
  # Phase 9 — @hocuspocus/extension-sqlite pulls in better-sqlite3, which
  # compiles native C++ bindings against the host platform during install.
  # See apps/hub/ and .ai/decisions/DDR-052-hocuspocus-over-partykit-for-hub.md.
  better-sqlite3: true
  # WebdriverIO (apps/desktop/e2e) pulls edgedriver/geckodriver as transitive deps,
  # but the desktop harness uses @wdio/tauri-service's embedded provider — it drives
  # the WKWebView directly and needs NEITHER a Firefox nor an Edge browser-driver
  # binary, so deny their download postinstall scripts. (If Windows-WebView2 e2e
  # later needs msedgedriver, @wdio/tauri-service auto-manages it — revisit then.)
  edgedriver: false
  esbuild: true
  geckodriver: false
  # Transitive dep of onnxruntime-web (feature-photo-editor's ML background
  # removal). Its postinstall only prints a semver-scheme lint warning (no
  # native build, no functional side effect anything here depends on) —
  # denied by default per this file's own convention above (build scripts
  # run only on demonstrated need, e.g. better-sqlite3's real native compile).
  protobufjs: false
  sharp: true
patchedDependencies:
  css-tree@2.2.1: patches/css-tree@2.2.1.patch
  css-tree@3.2.1: patches/css-tree@3.2.1.patch
  csso@5.0.5: patches/csso@5.0.5.patch
