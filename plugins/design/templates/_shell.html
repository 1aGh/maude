      // HMR client — listens for `canvas-hmr` messages on /_ws. Three modes:
      //   - css: swap <link> href with ?v=<version> cache bust.
      //   - module: location.reload() — the canvas module re-fetches.
      //   - hard: location.reload() — _lib/* changed, everything re-bundles.
      // The WS connection retries on close (dev-server restart resilience).
      const pendingMediaHeals = new WeakMap();
      function connectHmr() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        // `base` for the same reason every other URL here carries it: on the
        // fleet's canvas origin the project is in the path. (A cell's HMR socket
        // is a separate matter — it has no cookie to authenticate with, so it
        // simply does not connect there; a canvas still renders.)
        const ws = new WebSocket(proto + '://' + location.host + base + '/_ws');
        ws.addEventListener('message', (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (!msg) return;
            // Phase 13.1 / DDR-077 — own-WS path for the agent-active gate (this
            // socket is the inspector channel in standalone / same-origin mode;
            // embedded canvas-hmr sockets get ai-activity via the parent's
            // postMessage relay handled above).
            if (msg.type === 'ai-activity') {
              if (myFileKey && msg.file === myFileKey) agentEditing = !!msg.entry;
              return;
            }
            // Phase 13 / DDR-029 — canvas activity overlay. The server pushes
            // `{ type:'activity', file, status, artboard_ids, ts }` as edits land
            // + go idle; the injected runtime (use-canvas-activity.tsx) listens
            // for the `maude:activity` document event. Same-document bridge — no
            // second socket. The `snapshot` seed re-plays the activity map for a
            // tab that opens mid-edit (inspector-origin only).
            if (msg.type === 'activity') {
              // Maintain a running activity seed (shape matches the snapshot's
              // `activity.state`: camelCase artboardIds). Load-bearing for the
              // Phase 13.1 soft-reload: a soft remount resets the activity
              // provider WITHOUT a page reload (so no fresh snapshot), and the
              // provider re-seeds from this map — without it the overlay would
              // vanish on every agent .tsx save.
              if (!window.__maude_activity_seed__) window.__maude_activity_seed__ = {};
              if (msg.status === 'active') {
                window.__maude_activity_seed__[msg.file] = {
                  status: 'active', artboardIds: msg.artboard_ids || null, ts: msg.ts,
                };
              } else {
                delete window.__maude_activity_seed__[msg.file];
              }
              document.dispatchEvent(new CustomEvent('maude:activity', { detail: msg }));
              return;
            }
            if (msg.type === 'snapshot' && msg.activity && typeof msg.activity === 'object') {
              // Stash so the provider can seed on mount even if it isn't listening
              // yet (the snapshot can arrive before React mounts — a real race
              // after the HMR reload that a canvas edit triggers). Also dispatch
              // for any provider that IS already mounted (same-origin live case).
              window.__maude_activity_seed__ = msg.activity;
              for (const file in msg.activity) {
                const e = msg.activity[file];
                if (!e) continue;
                document.dispatchEvent(new CustomEvent('maude:activity', {
                  detail: { type: 'activity', file: file, status: e.status, artboard_ids: e.artboardIds || null, ts: e.ts },
                }));
              }
              return;
            }
            if (msg.type !== 'canvas-hmr') return;
            if (msg.mode === 'css') {
              const v = msg.version || Date.now();
              // Match by PATH when we have one; otherwise refresh all. By path,
              // not by file name: every design system has a `tokens.css`, and
              // a change to one canvas's imported `system/<a>/tokens.css`
              // "matched" the shell's link to `system/<b>/tokens.css` — which
              // swapped the wrong sheet and skipped the reload below that the
              // changed one needed (plan T31/L16).
              const changed = msg.file ? '/' + msg.file : '';
              let matched = false;
              for (const link of document.querySelectorAll('link[rel="stylesheet"]')) {
                const href = link.getAttribute('href') || '';
                if (!href) continue;
                let linkPath = '';
                try {
                  linkPath = decodeURIComponent(new URL(href, location.href).pathname);
                } catch {}
                if (!changed || linkPath.endsWith(changed)) {
                  const base = href.split('?')[0];
                  link.setAttribute('href', base + '?v=' + v);
                  matched = true;
                }
              }
              // A per-canvas `<slug>.css` imported by the TSX is INLINED into the
              // canvas module as a <style> by Bun.build — there is no <link> to
              // swap, so the loop above matches nothing and the edit is silently
              // dropped until a manual hard-reload (RCA hmr-inlined-css-dropped).
              // When nothing matched AND the changed CSS lives in THIS canvas's
              // directory, reload so the rebuilt module re-inlines the fresh CSS.
              // Scoped to same-dir so an unrelated specimen's CSS write doesn't
              // reload every open tab.
              if (!matched && msg.file && canvasRel) {
                const cssDir = msg.file.replace(/[^/]+$/, '');
                const canvasDir = canvasRel.replace(/[^/]+$/, '');
                if (cssDir === canvasDir) {
                  location.reload();
                } else {
                  // …and a stylesheet imported from ANYWHERE else (a design
                  // system's tokens.css) is inlined the same way. The module's
                  // style tag names what it inlined; re-import so it re-injects.
                  // (Canvas script could add names here, but that can only
                  // FORCE a reload — the safe direction.)
                  var bundled = document.querySelector('style[data-canvas-css="bundled"]');
                  var names = bundled && bundled.dataset.canvasCssSources ? bundled.dataset.canvasCssSources.split('|') : [];
                  if (names.indexOf(msg.file) !== -1) {
                    if (window.__maudeCanvasRuntime && window.__maudeCanvasRuntime.remount) softReload(v);
                    else location.reload();
                  }
                }
              }
            } else if (msg.mode === 'module' || msg.mode === 'hard') {
              // Only reload when the change touches *this* canvas (or `_lib`) — and, in
              // Present · Artboards, not while the audience is looking (A8, below).
              routeModuleUpdate(msg);
            } else if (msg.mode === 'meta') {
              // Phase 8 — canvas-meta sidecar changed. Filter to our own canvas:
              // `<canvasRel>.meta.json` strip → must equal canvasRel without ext.
              if (!canvasRel || !msg.file) return;
              // A past version's meta is its own — today's sidecar changing does not move it.
              if (versionMeta) return;
              const metaBase = msg.file.replace(/\.meta\.json$/i, '');
              const myBase = canvasRel.replace(/\.(tsx|html)$/i, '');
              if (metaBase !== myBase) return;
              // Echo guard — when WE just PATCHed the meta, skip the round-trip. S4.19 (an-follow): the
              // window alone swallowed a foreign write too — a ⌘Z within 2 s of a drag restored the file
              // and the live artboard stayed at the drop spot. So inside the window the fresh file is
              // still read and compared with the layout canvas-lib mirrored into the snapshot when it
              // wrote; only a file that says what we wrote is an echo.
              var sinceSelf = Date.now() - ((window).__maude_last_meta_self_write_at || 0);
              // Re-fetch + broadcast to the canvas via window event. canvas-lib
              // listens for `maude:meta-refreshed` and re-applies layout +
              // viewport in-place (no full reload — preserves tool / undo state).
              const metaFileParam = encodeURIComponent(designRel + '/' + canvasRel);
              fetch(withCap('/_api/canvas-meta?file=' + metaFileParam), {
                headers: { 'Cache-Control': 'no-store' },
              })
                .then((r) => (r.ok ? r.json() : null))
                .then((j) => {
                  if (!j || typeof j !== 'object') return;
                  if (metaIsOwnEcho(sinceSelf, j, window.__canvas_meta__)) return;
                  window.__canvas_meta__ = j;
                  document.dispatchEvent(new CustomEvent('maude:meta-refreshed', { detail: j }));
                })
                .catch(() => {
                  /* network blip — next interaction will retry */
                });
            } else if (msg.mode === 'asset') {
              // 2026-08-15 annotations-assets RCA — a synced-down media file
              // just landed on disk. Any <img> / SVG <image> that already
              // 404'd on it shows the broken glyph FOREVER (browsers never
              // retry a failed load), so the heal was invisible: the bytes
              // arrived, the canvas stayed broken until a manual reload.
              // Re-point matching, still-broken elements at a cache-busted
              // URL — no reload, no React state loss. A later React render
              // restoring the clean URL refetches it fresh (the file exists
              // now), so both URLs converge on the good bytes.
              const assetName = (msg.file || '').split('/').pop();
              if (!assetName) return;
              // A PhotoEdit sidecar (`<sha8>.photo.json`) — nothing on the
              // page references the sidecar itself, so re-pointing <img> would
              // be a no-op. Hand the fact to the canvas instead: canvas-lib's
              // PhotoPreviewBridge re-fetches the edit and re-bakes the photo.
              if (/\.photo\.json$/i.test(assetName)) {
                const sha8 = assetName.replace(/\.photo\.json$/i, '');
                document.dispatchEvent(
                  new CustomEvent('maude:photo-edit-refreshed', { detail: { sha8: sha8 } })
                );
                return;
              }
              const v = msg.version || Date.now();
              const nameMatches = function (u) {
                if (!u) return false;
                return u.indexOf(assetName) !== -1 || u.indexOf(encodeURIComponent(assetName)) !== -1;
              };
              for (const img of document.querySelectorAll('img')) {
                const src = img.getAttribute('src');
                if (!nameMatches(src)) continue;
                // Already rendering fine — don't churn a working image.
                if (img.complete && img.naturalWidth > 0) continue;
                img.setAttribute('src', src.split('?')[0] + '?v=' + v);
              }
              for (const el of document.querySelectorAll('image')) {
                const href = el.getAttribute('href') || el.getAttribute('xlink:href');
                if (!nameMatches(href)) continue;
                // SVG <image> exposes no broken-state flag — re-pointing a
                // working one is a cheap refetch of now-cached bytes.
                el.setAttribute('href', href.split('?')[0] + '?v=' + v);
              }
              // A reference can reach a peer before its video/audio bytes.
              // Retry failed players when those bytes arrive, without resetting
              // healthy playback or dropping capability parameters from the URL.
              const arrivedUrl = new URL(withCap('/' + designRel + '/' + msg.file), document.baseURI);
              for (const media of document.querySelectorAll('video, audio')) {
                if (media.readyState > 0) continue;
                const candidates = media.hasAttribute('src')
                  ? [media]
                  : Array.from(media.querySelectorAll('source[src]'));
                const targets = candidates.flatMap((target) => {
                  const src = target.getAttribute('src');
                  if (!src) return [];
                  try {
                    const url = new URL(src, document.baseURI);
                    if (url.origin !== arrivedUrl.origin || url.pathname !== arrivedUrl.pathname) return [];
                    url.searchParams.set('v', String(v));
                    return [{ target, src, next: url.href }];
                  } catch { return []; }
                });
                if (!targets.length) continue;
                pendingMediaHeals.get(media)?.();
                const clear = () => {
                  media.removeEventListener('error', retry, true);
                  media.removeEventListener('loadedmetadata', clear);
                  media.removeEventListener('emptied', clear);
                  pendingMediaHeals.delete(media);
                };
                const retry = () => {
                  clear();
                  if (!media.isConnected || media.readyState > 0) return;
                  if (targets.some(({ target, src }) => target.getAttribute('src') !== src)) return;
                  for (const { target, next } of targets) target.setAttribute('src', next);
                  media.load();
                };
                if (media.error || media.networkState === 3) {
                  retry();
                } else if (media.networkState === 2) {
                  // The initial response can still be an older in-flight 404.
                  // One arrival permits one retry; success/source change cancels it.
                  pendingMediaHeals.set(media, clear);
                  media.addEventListener('error', retry, true);
                  media.addEventListener('loadedmetadata', clear);
                  media.addEventListener('emptied', clear);
                }
              }
            }
          } catch (e) {
            console.warn('[canvas-shell] HMR message parse error', e);
          }
        });
        ws.addEventListener('close', () => {
          // Reconnect after a beat — dev-server may have restarted.
          setTimeout(connectHmr, 750);
        });
      }
      connectHmr();

      // HEAL WEBFONTS THAT FAILED ON A COLD CLOUD CACHE.
      //
      // On a cell the disk is a cache: the first request for a font the cell
      // has not fetched yet makes the hub pull it from storage, and while that
      // runs the static route answers 503 (retry shortly). An <img> is
      // re-pointed when its bytes arrive (the asset-arrived handler above), but
      // a CSS `@font-face` that failed stays failed for the life of the
      // document — the canvas renders in a fallback serif until a reload, and
      // which fonts lose the race differs every time ("the fonts are flaky").
      //
      // There is no way to re-run a CSS-connected FontFace, so a failed one is
      // REPLACED: the same descriptors, read back from the stylesheet's own
      // `@font-face` rule, with a cache-busting query on each url so the browser
      // asks again. A face added through `document.fonts` is matched after the
      // stylesheet's, so once it loads the text re-renders in it.
      const fontHeal = { attempts: new Map(), timer: 0 };
      const FONT_RETRY_DELAYS_MS = [1500, 3000, 5000, 8000, 12000, 20000];
      const unquote = (s) => String(s || '').trim().replace(/^(['"])(.*)\1$/, '$2');
      function* fontFaceRules(rules) {
        for (const rule of rules || []) {
          if (typeof CSSFontFaceRule !== 'undefined' && rule instanceof CSSFontFaceRule) yield rule;
          else if (rule.cssRules) yield* fontFaceRules(rule.cssRules);
        }
      }
      function faceKey(family, weight, style, range) {
        return [unquote(family), weight || '', style || '', range || ''].join('|');
      }
      function healFailedFonts() {
        fontHeal.timer = 0;
        if (!document.fonts) return;
        const failed = new Set();
        for (const f of document.fonts) {
          if (f.status === 'error') failed.add(faceKey(f.family, f.weight, f.style, f.unicodeRange));
        }
        if (!failed.size) return;
        for (const sheet of Array.from(document.styleSheets)) {
          let rules;
          try { rules = sheet.cssRules; } catch (e) { continue; }
          for (const rule of fontFaceRules(rules)) {
            const st = rule.style;
            const family = st.getPropertyValue('font-family');
            const src = st.getPropertyValue('src');
            if (!family || !src) continue;
            const descriptors = {
              weight: st.getPropertyValue('font-weight') || undefined,
              style: st.getPropertyValue('font-style') || undefined,
              stretch: st.getPropertyValue('font-stretch') || undefined,
              unicodeRange: st.getPropertyValue('unicode-range') || undefined,
              display: st.getPropertyValue('font-display') || undefined,
            };
            for (const k of Object.keys(descriptors)) if (!descriptors[k]) delete descriptors[k];
            let probe;
            try { probe = new FontFace(unquote(family), 'local("maude-probe")', descriptors); } catch (e) { continue; }
            const key = faceKey(probe.family, probe.weight, probe.style, probe.unicodeRange);
            if (!failed.has(key)) continue;
            const n = (fontHeal.attempts.get(key) || 0) + 1;
            if (n > FONT_RETRY_DELAYS_MS.length) continue;
            fontHeal.attempts.set(key, n);
            const base = sheet.href || document.baseURI;
            const busted = src.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (whole, q, raw) => {
              if (/^data:/i.test(raw)) return whole;
              try {
                const u = new URL(raw, base);
                u.searchParams.set('font-retry', String(n));
                return 'url("' + u.href.replace(/"/g, '%22') + '")';
              } catch (e) { return whole; }
            });
            let face;
            try { face = new FontFace(unquote(family), busted, descriptors); } catch (e) { continue; }
            face.load().then(
              () => {
                document.fonts.add(face);
                failed.delete(key);
              },
              () => scheduleFontHeal(FONT_RETRY_DELAYS_MS[n] || 0)
            );
          }
        }
      }
      function scheduleFontHeal(delay) {
        if (!delay || fontHeal.timer) return;
        fontHeal.timer = setTimeout(healFailedFonts, delay);
      }
      if (document.fonts && document.fonts.addEventListener) {
        document.fonts.addEventListener('loadingerror', () => scheduleFontHeal(FONT_RETRY_DELAYS_MS[0]));
      }

      // NO TOP-LEVEL AWAIT IN THIS MODULE.
      //
      // The boot below used to `await` at the top level, which made this the
      // one asynchronously-evaluated module on the page — suspended, with its
      // own dynamic `import()`s in flight, for as long as the canvas took to
      // build. On the desktop (WKWebView) switching canvases away and straight
      // back, which tears the half-loaded frame down in exactly that state,
      // eventually wedged the whole web content process inside JavaScriptCore's
      // module loader: 100 % CPU in `moduleLoaderEvaluate` microtasks, no script
      // ever running again, every canvas and the shell frozen (surface row L23,
      // 2026-09-16 — reproduced in a full run and in a ten-minute soak). An
      // async function that nothing awaits gives the same boot with a module
      // that finishes evaluating at once, the path every engine exercises most.
      const boot = async () => {
      if (!canvasRel) {
        showError('Missing ?canvas= query parameter. Add ?canvas=ui/<slug>.tsx.');
      } else {
        if (tokensRel) document.getElementById('canvas-tokens').href = withCap('/' + designRel + '/' + tokensRel);
        if (componentsRel) document.getElementById('canvas-components').href = withCap('/' + designRel + '/' + componentsRel);
        if (layoutRel) {
          // Inject a third <link> for the DS layout chrome (specimens load this).
          const layoutLink = document.createElement('link');
          layoutLink.rel = 'stylesheet';
          layoutLink.href = withCap('/' + designRel + '/' + layoutRel);
          layoutLink.dataset.canvasCss = 'layout';
          document.head.appendChild(layoutLink);
        }

        // canvasUrl is hoisted above (Phase 13.1) so the HMR soft-reload can use it.
        // Phase 4 T5 — read the canvas's sibling .meta.json and stash it on
        // window so DesignCanvas can seed `layout` + `viewport` synchronously.
        // The fetch runs in parallel with imports; failure is non-fatal (the
        // canvas falls through to default grid + fit-to-screen).
        const metaFileParam = encodeURIComponent(designRel + '/' + canvasRel);
        // Phase 8 — expose designRel + canvasRel-without-prefix on window so
        // collab-slug derivation can strip the prefix consistently with
        // server-side api.fileSlug (which trims paths.designRel).
        window.__canvas_design_rel__ = designRel;
        window.__canvas_rel__ = canvasRel;
        // S1.11 — a past version (`?sha=`) brings its own meta lane, injected by the server as
        // window.__canvas_meta_version__ (V2-1.9 §5.6); without one, today's meta as before.
        const metaFetch = (versionMeta
          ? Promise.resolve(versionMeta)
          : fetch(withCap('/_api/canvas-meta?file=' + metaFileParam), {
              headers: { 'Cache-Control': 'no-store' },
            }).then((r) => (r.ok ? r.json() : null)))
          .then((j) => {
            window.__canvas_meta__ = (j && typeof j === 'object') ? j : {};
            window.__canvas_meta_file__ = designRel + '/' + canvasRel;
          })
          .catch(() => {
            window.__canvas_meta__ = {};
            window.__canvas_meta_file__ = designRel + '/' + canvasRel;
          });
        try {
          // mountCanvas (dist/comment-mount.js) owns the React root + the lite
          // comment provider tree. It externalizes react / react-dom/client to
          // the importmap so the canvas module and the comment layer share one
          // React singleton (inlining a second React would break hooks).
          const [{ mountCanvas }, mod] = await Promise.all([
            import(withCap('/_client/comment-mount.js')),
            import(canvasUrl),
            metaFetch,
          ]);
          const Canvas = mod.default;
          if (typeof Canvas !== 'function') {
            throw new Error(
              'Canvas module at ' + canvasUrl + ' has no default export (or it is not a component).'
            );
          }
          const rootEl = document.getElementById('canvas-root');
          mountCanvas(Canvas, {
            rootEl,
            file: designRel + '/' + canvasRel,
            commentsEnabled,
          });
          // The studio's loading screen stays up until this arrives — `loaded`
          // (inspect.ts) only proves the shell document ran, which on a cold
          // cloud canvas is seconds before anything is drawn, so dropping the
          // screen there showed a white pane with bare comment pins. Wait for
          // React to commit the canvas and for its fonts, so it does not appear
          // in a fallback face and then jump. Capped: a font that never
          // arrives must not hold the screen forever.
          //
          // NOT requestAnimationFrame: while the studio's opaque loading screen
          // covers this cross-origin frame, Chrome throttles its frames, so a
          // rAF-gated signal only ever arrived via the cap — the cover was
          // waiting on itself. Timers and a forced layout run regardless.
          let renderedSent = false;
          const announceRendered = () => {
            if (renderedSent) return;
            renderedSent = true;
            try {
              window.parent.postMessage({ dgn: 'canvas-rendered', file: designRel + '/' + canvasRel }, '*');
            } catch (e) { /* parent gone */ }
          };
          setTimeout(announceRendered, 8000);
          const committed = new Promise((resolve) => {
            const started = Date.now();
            const tick = () => {
              if ((rootEl && rootEl.children.length > 0) || Date.now() - started > 4000) resolve();
              else setTimeout(tick, 40);
            };
            tick();
          });
          committed
            .then(() => {
              // Lay the canvas out now so the browser knows which fonts it
              // uses and starts them — `fonts.ready` only waits on loads that
              // have begun.
              try { if (rootEl) rootEl.getBoundingClientRect(); void document.body.offsetHeight; } catch (e) {}
              const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
              return Promise.race([fontsReady, new Promise((r) => setTimeout(r, 3000))]);
            })
            .then(announceRendered, announceRendered);
          // T2 (9.1-A) diagnostic — tell the parent the canvas mounted + how many
          // root children it rendered. Lets the shell (and tooling) confirm a
          // cross-origin canvas actually rendered, which a parent-page screenshot
          // of an OOPIF cannot show. Harmless heartbeat; ignored if unhandled.
          setTimeout(() => {
            try {
              window.parent.postMessage(
                { dgn: 'canvas-mounted', file: designRel + '/' + canvasRel, children: rootEl ? rootEl.children.length : 0 },
                '*'
              );
            } catch (e) { /* parent gone */ }
          }, 800);
        } catch (err) {
          // The canvas module is the import worth diagnosing — comment-mount is
          // ours and does not 422 on tenant content.
          diagnoseImportFailure(canvasUrl, err).then(showError);
        }
      }
      };
      boot().catch((err) => showError(String((err && err.stack) || err)));
    </script>
  </body>
</html>
