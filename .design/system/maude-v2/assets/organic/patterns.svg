<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 928 560"><title>maude-v2 patterns</title><desc>Seamless decorative &lt;pattern&gt; tiles for the maude-v2 design system, light and dark: mv2-pattern-dots-{light|dark} (20px canvas dot grid, --canvas-dot), mv2-pattern-grain-{light|dark} (paper/frost grain for islands and onboarding, --fg-0 specks), mv2-pattern-confetti-{light|dark} (sparse rotated sticky squares in the --object-* palette, for empty states). Use with fill=&quot;url(#id)&quot; on a rect over the theme background; all tiles use userSpaceOnUse and stay quiet enough for text on top.</desc><defs><pattern id="mv2-pattern-dots-light" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#b8bfc4"/></pattern><pattern id="mv2-pattern-grain-light" width="128" height="128" patternUnits="userSpaceOnUse"><g filter="url(#mv2-grain-noise-light)" opacity=".07"><path d="M0 0h128v128H0z"/></g></pattern><pattern id="mv2-pattern-confetti-light" width="320" height="240" patternUnits="userSpaceOnUse"><rect width="8" height="8" x="-4" y="-4" fill="#ffb1a1" rx="1" transform="rotate(24 -258.92 558.55)"/><rect width="6" height="6" x="-3" y="-3" fill="#9ed7f3" rx="1" transform="rotate(-16 253.46 -254.61)"/><rect width="6" height="6" x="-3" y="-3" fill="#86db9d" rx="1" transform="rotate(34 -294.38 90)"/><rect width="6" height="6" x="-3" y="-3" fill="#86db9d" rx="1" transform="rotate(34 -134.38 613.34)"/><rect width="4" height="4" x="-2" y="-2" fill="#cebdf2" rx="1" transform="rotate(-10 80 -914.4)"/><rect width="4" height="4" x="-2" y="-2" fill="#cebdf2" rx="1" transform="rotate(-10 1451.6 -794.4)"/><rect width="4" height="4" x="-2" y="-2" fill="#fae180" rx="1" transform="rotate(-28 280.43 -441.3)"/></pattern><pattern id="mv2-pattern-dots-dark" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#3a3d41"/></pattern><pattern id="mv2-pattern-grain-dark" width="128" height="128" patternUnits="userSpaceOnUse"><g filter="url(#mv2-grain-noise-dark)" opacity=".08"><path d="M0 0h128v128H0z"/></g></pattern><pattern id="mv2-pattern-confetti-dark" width="320" height="240" patternUnits="userSpaceOnUse"><rect width="8" height="8" x="-4" y="-4" fill="#803a2e" rx="1" transform="rotate(24 -258.92 558.55)"/><rect width="6" height="6" x="-3" y="-3" fill="#135a76" rx="1" transform="rotate(-16 253.46 -254.61)"/><rect width="6" height="6" x="-3" y="-3" fill="#0d6332" rx="1" transform="rotate(34 -294.38 90)"/><rect width="6" height="6" x="-3" y="-3" fill="#0d6332" rx="1" transform="rotate(34 -134.38 613.34)"/><rect width="4" height="4" x="-2" y="-2" fill="#594878" rx="1" transform="rotate(-10 80 -914.4)"/><rect width="4" height="4" x="-2" y="-2" fill="#594878" rx="1" transform="rotate(-10 1451.6 -794.4)"/><rect width="4" height="4" x="-2" y="-2" fill="#685000" rx="1" transform="rotate(-28 280.43 -441.3)"/></pattern><filter id="mv2-grain-noise-light" width="1" height="1" x="0" y="0" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".85" numOctaves="2" result="n" seed="7" stitchTiles="stitch" type="fractalNoise"/><feColorMatrix in="n" values="0 0 0 0 0.102 0 0 0 0 0.125 0 0 0 0 0.149 3 0 0 0 -1.2"/></filter><filter id="mv2-grain-noise-dark" width="1" height="1" x="0" y="0" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".85" numOctaves="2" result="n" seed="7" stitchTiles="stitch" type="fractalNoise"/><feColorMatrix in="n" values="0 0 0 0 0.945 0 0 0 0 0.957 0 0 0 0 0.965 3 0 0 0 -1.2"/></filter></defs><rect width="288" height="256" x="16" y="16" fill="#f5f8fb" rx="20"/><rect width="288" height="256" x="16" y="16" fill="url(#mv2-pattern-dots-light)" rx="20"/><text x="32" y="256" fill="#1a2026" font-family="-apple-system, system-ui, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600">Canvas dot grid · 20 px</text><rect width="288" height="256" x="320" y="16" fill="#fcfeff" rx="20"/><rect width="288" height="256" x="320" y="16" fill="url(#mv2-pattern-grain-light)" rx="20"/><text x="336" y="256" fill="#1a2026" font-family="-apple-system, system-ui, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600">Frost grain · islands, onboarding</text><rect width="288" height="256" x="624" y="16" fill="#f5f8fb" rx="20"/><rect width="288" height="256" x="624" y="16" fill="url(#mv2-pattern-confetti-light)" rx="20"/><text x="640" y="256" fill="#1a2026" font-family="-apple-system, system-ui, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600">Sticky confetti · empty states</text><rect width="288" height="256" x="16" y="288" fill="#15171a" rx="20"/><rect width="288" height="256" x="16" y="288" fill="url(#mv2-pattern-dots-dark)" rx="20"/><text x="32" y="528" fill="#f1f4f6" font-family="-apple-system, system-ui, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600">Canvas dot grid · 20 px</text><rect width="288" height="256" x="320" y="288" fill="#1e2124" rx="20"/><rect width="288" height="256" x="320" y="288" fill="url(#mv2-pattern-grain-dark)" rx="20"/><text x="336" y="528" fill="#f1f4f6" font-family="-apple-system, system-ui, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600">Frost grain · islands, onboarding</text><rect width="288" height="256" x="624" y="288" fill="#15171a" rx="20"/><rect width="288" height="256" x="624" y="288" fill="url(#mv2-pattern-confetti-dark)" rx="20"/><text x="640" y="528" fill="#f1f4f6" font-family="-apple-system, system-ui, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, sans-serif" font-size="12" font-weight="600">Sticky confetti · empty states</text></svg>